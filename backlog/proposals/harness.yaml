# Champs ajoutés au format FORMAT.md : `stage` (S0..S3, I1..I8) et `model` suggéré (haiku | sonnet | opus ; DeepSeek = seulement après HAR-20).
# Faits web : [V] lus le 2026-11-18 (y compris DeepSeek et GitHub par curl) ; seul [NV] restant : modes dind/kubernetes d'ARC (HAR-13).
