  intent: "Une seule montée en dev à la fois (concurrency group), ≤ 2 apps, refus de démarrer si les requests dépassent 70 % ; le surcoût transitoire d'un rolling update sur un nœud unique est pris en compte."
  done:
    - "deux PR simultanées : la seconde attend, preuve dans les journaux CI"
    - "montée refusée avec cause typée BUDGET quand le seuil est dépassé (simulé)"

