# Propositions de tickets — domaine UPGRADES (montées de version automatisées).
# Recherche : docs/research/UPGRADES.md. ADR proposé : "NEW-UPGRADES" (Montées de version automatisées).
# Les faits web non vérifiés sont marqués [E] dans la recherche ; revérifier avant de démarrer chaque ticket.

- key: UPG-1
  title: "Renovate durci : catégories, âge minimal, limites de PR, dashboard, labels"
  phase: P0
  adr: ["NEW-UPGRADES"]
  depends_on: ["T-002"]
  class: REVUE
  velocity: true
  parallel_lane: "renovate"
  scope: ".github/renovate.json"
  intent: "Réécrire la config Renovate selon la politique par catégorie : internalChecksFilter strict, minimumReleaseAge par catégorie, prConcurrentLimit 4 et prHourlyLimit 2, dashboard, labels upgrade:<catégorie>, vulnerabilityAlerts, groupes, règle enabled false pour OpenChoreo. Fichier du noyau (ADR-0002) : Paul approuve."
  done:
    - "renovate-config-validator passe en CI sur la nouvelle config"
    - "dry-run Renovate (LOG_LEVEL debug) montre la catégorie et l'âge retenus pour une image, un chart, une action, un fichier versions.env"
    - "aucune règle d'automerge sur 0.x, noyau, ni apps stateful"
    - "rattrapage initial en approbation par le dashboard, groupé par catégorie"
  notes: "Absorbe le volet Renovate de T-064. Les digests d'apps restent AUTO mais passent par la porte UPG-5."
  absorbs: ["T-064"]

- key: UPG-2
  title: "Renovate auto-hébergé avec GitHub App (CI déclenchée, postUpgradeTasks)"
  phase: P0
  adr: ["NEW-UPGRADES"]
  depends_on: ["UPG-1", "T-068"]
  class: REVUE + MANDAT
  velocity: true
  parallel_lane: "renovate"
  scope: ".github/workflows/renovate.yml"
  intent: "Exécuter Renovate en Action planifiée avec un jeton d'App GitHub, pour que les PR déclenchent la CI et que appgen render tourne en postUpgradeTasks. Créer l'App et ses secrets est un geste de Paul (nouvelle identité)."
  done:
    - "PR Renovate de test : ci-ok se déclenche et generated/ est régénéré dans la même PR"
    - "geste MANDAT décrit par noms (App, permissions minimales, secret), jamais de valeur"
    - "allowedCommands limite postUpgradeTasks à appgen"

- key: UPG-3
  title: "upgrade-gate : classification exécutable des PR de montée"
  phase: P1
  adr: ["NEW-UPGRADES"]
  depends_on: ["UPG-1", "T-002", "T-072"]
  class: AUTONOME + REVUE
  velocity: true
