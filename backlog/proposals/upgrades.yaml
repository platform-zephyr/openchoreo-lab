  scope: "tools/upgrades/, tests/upgrades/, .github/workflows/ci.yaml (câblage, REVUE)"
  intent: "Script et check requis qui lit le diff d'une PR, déduit catégorie, type de montée, classe de donnée, registre, et refuse l'automerge si une règle « jamais » s'applique. Sortie JSON typée (règle, champ, correction)."
  done:
    - "un test de refus par règle transverse (0.x, noyau, stateful sans sauvegarde, registre inconnu, securityExceptions)"
    - "check upgrade-gate requis sur main et visible dans ci-ok"
    - "la politique est un fichier de données (tools/upgrades/policy.yaml) couvert par le noyau"

- key: UPG-4
  title: "Garde d'image : arm64, registre autorisé, signature cosign, provenance"
  phase: P1
  adr: ["NEW-UPGRADES", "0006"]
  depends_on: ["UPG-3"]
