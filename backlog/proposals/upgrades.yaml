    - "éditeur signé avec signature invalide : refus ; éditeur non signé : perte de l'AUTO seulement"
    - "aucune clé ni jeton dans le dépôt (identités keyless en variables du check)"

- key: UPG-5
  title: "Porte de merge des apps : dev, preuve PASS, promotion automatique, revert automatique"
  phase: P1
  adr: ["NEW-UPGRADES", "0004", "0011"]
  depends_on: ["UPG-3", "T-003", "T-005", "T-065"]
  class: AUTONOME + REVUE
  velocity: true
  parallel_lane: "porte"
  scope: ".github/workflows/, tools/appgen/ (promote --auto), tools/upgrades/"
  intent: "Chaîner PR Renovate -> ci-ok -> merge -> release en development -> app-status RUNTIME PASS -> PR de promotion fusionnée -> preuve production ; en échec, PR de revert automatique et résumé dans la PR d'origine."
  done:
    - "preuve OKE datée : un bump de digest d'une app A traverse dev puis prod sans humain"
    - "échec volontaire : revert automatique, production inchangée, fiche d'incident"
    - "un git revert conserve les releases historiques (job release-history vert)"
  notes: "T-065 reste en place (CronJob de santé et revert) et devient prérequis ; ce ticket n'en reprend que l'enchaînement spécifique aux montées."

- key: UPG-6
  title: "File sérialisée des montées en development et garde de budget"
  phase: P1
  adr: ["NEW-UPGRADES", "0004"]
