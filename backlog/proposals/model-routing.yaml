# Propositions du domaine « Routage des modèles par tâche » (ADR proposé : NEW-MODELS = ADR-0021, voir docs/research/MODEL-ROUTING.md §7)
# Deux listes :
#   rules   : règles machine-lisibles ; la PREMIÈRE règle dont `match` correspond s'applique (fin de liste = défaut).
#   tickets : tickets MOD-n au format backlog/proposals/FORMAT.md, avec en plus `stage` et `model` (modèle conseillé pour exécuter le ticket).
# Marque : status: hypothesis = règle non étalonnée (MOD-7) ; unverified = dépend d'une source non lue (DeepSeek).
# `match` : lane (liste de couloirs ou motifs *), class (classe recalculée depuis les chemins), paths (globs), keywords (titre/intention),
#           kind (type de tâche déclaré par le dispatcher : review, adversarial-review, incident, remediation, plan, research, doc, ticket-writing, watch, internal-ai, bench).
# `escalate` : after = nombre d'échecs (ci_fail | blocking_finding | out_of_scope | unproven_hypothesis) avant de monter d'un cran.
# `floor` : modèle minimal ; le champ `model:` d'un ticket peut monter au-dessus, jamais descendre dessous.

meta:
  date: "2026-11-18"
  ladder: [haiku-5-5, sonnet-5-5/medium, sonnet-5-5/high, opus-5-5/high, opus-5-5/max, human]   # Fable hors échelle (TB 4.1 : 65,8 % comme Opus 5.5 pour 3,5x le coût)
  ids:
    haiku-5-5: claude-haiku-5-5
    sonnet-5-5: claude-sonnet-5-5
    opus-5-5: claude-opus-5-5
    fable-5-2: claude-fable-5-2
  caps:
    sonnet_max_effort: xhigh          # Sonnet 5.5 à `max` fait moins bien qu'à `xhigh` (annonce Anthropic, lue le 2026-11-18)
    fable: "sur demande de Paul seulement ; jamais en CI planifiée ; plafond 50 % du quota hebdomadaire ; Terminal-Bench 4.1 (2026-11-17) : 65,8 % = Opus 5.5, coût 16,5 k$ contre 4,7 k$"
    quota_fallback: "si quota hebdomadaire Max > 70 % consommé : Opus -> Sonnet high, sauf règles floor: opus du noyau (file d'attente)"
  confidentiality:
    deepseek_allowed_data: [public-repo]
    deepseek_denied_data: [prod-logs, secrets, "data-class != public", user-identifiers]
    deepseek_basis: "politique de confidentialité DeepSeek (cdn.deepseek.com, lue le 2026-11-18) : entrées utilisables pour entraîner ; conditions API non lues (NOT_PROVEN)"
  deepseek:
    source: "api-docs.deepseek.com/quick_start/pricing, lue le 2026-11-18"
    models: {deepseek-flash: "V4.1-Flash-1017, 0,15/0,60 $/MTok creux (x2 pointe), cache 0,003", deepseek-v4-pro: "V4-Pro-0813, 0,66/1,98 creux, TB 4.1 = 6,7 % : exclu des agents"}
    peak_utc: "01-04 h et 06-10 h, lundi-vendredi : planifier les lots hors de ces heures"
    claude_code_env: {ANTHROPIC_BASE_URL: "https://api.deepseek.com/anthropic", alias_opus_sonnet_haiku: deepseek-flash, trap: "un nom claude-opus* est routé vers deepseek-v4-pro (tarif Pro)"}
  terminal_bench_4_1: {date: "2026-11-17", agent: claude-code, effort: max, opus-5-5: 65.8, fable-5-2: 65.8, sonnet-5-5: 63.9, haiku-5-5: 40.0, deepseek-flash-1017: 38.5, deepseek-v4-pro-0813: 6.7, cost_k_usd: {opus-5-5: 4.7, fable-5-2: 16.5, sonnet-5-5: 7.3, haiku-5-5: 1.0, deepseek-flash-1017: 0.2}}

rules:
  - id: R01-noyau-securite
    match:
      lane: [securite, admission, "identité-secrets/*", identité-agents, mcp, sandbox, supply-chain, gouvernance]
      paths: ["platform/policies/**", "platform/authz/**", "platform/project-types/**", "platform/secrets/**", ".agents/**", "CODEOWNERS", "users/**", "groups/**", "identities/**"]
    model: claude-opus-5-5
    effort: high
    floor: claude-opus-5-5
    review: {model: claude-opus-5-5, effort: high, note: "revue adverse par une session distincte de l'auteur"}
    escalate: {after: 2, on: [ci_fail, blocking_finding], to: {model: claude-opus-5-5, effort: max}, then: human}
    rationale: "Erreur coûteuse (admission, RBAC, secrets) et noyau d'ADR-0002 ; aucun benchmark ne couvre ce domaine, donc plancher par coût de l'erreur."
    status: hypothesis
  - id: R02-revue-adverse
    match: {kind: [adversarial-review]}
    model: claude-opus-5-5
    effort: high
    floor: claude-opus-5-5
    constraint: "modèle différent de celui de l'auteur (erreurs corrélées) ; effort max pour un ADR ou un changement de noyau classé MANDAT"
    escalate: {after: 1, on: [unproven_hypothesis], to: {model: claude-opus-5-5, effort: max}}
    rationale: "Lire un diff coûte peu de sortie ; la qualité du jugement compte plus que le prix."
    status: hypothesis
  - id: R03-incident-prod
    match: {kind: [incident], lane: [remédiation, plateforme-santé, exploitation]}
    model: claude-sonnet-5-5
    effort: high
    providers_allowed: [anthropic]          # logs de production : jamais DeepSeek
    escalate: {after: 2, on: [unproven_hypothesis], to: {model: claude-opus-5-5, effort: high}}
    rationale: "Diagnostic en lecture seule, longue chaîne d'outils : Sonnet 70,6 % à Terminal-Bench 4.0 ; Opus si la cause n'est pas prouvée après 2 hypothèses."
    status: hypothesis
  - id: R04-remediation
    match: {kind: [remediation]}
    model: claude-sonnet-5-5
    effort: high
    providers_allowed: [anthropic]
    escalate: {after: 1, on: [ci_fail], to: {model: claude-opus-5-5, effort: high}, also_when: "data-class irreplaceable, migration ou revert en échec"}
    rationale: "Correctif par PR, revert par git revert ; le coût d'erreur monte avec les données, d'où une seule tentative avant Opus."
    status: hypothesis
  - id: R05-coordination-planification
    match: {kind: [plan], lane: [gouvernance, porte]}
    model: claude-opus-5-5
    effort: high
    escalate: {after: 2, on: [blocking_finding], to: {model: claude-opus-5-5, effort: max}, then: human, note: "arbitrage inter-ADR : Paul"}
    rationale: "Peu de tokens, décisions lourdes : un plan faux fait perdre plus de quota que son coût."
    status: hypothesis
  - id: R06-refactor-appgen
    match: {lane: [contrat-appgen, appgen], keywords: [refactor, découper, modulaire, schéma]}
    model: claude-sonnet-5-5
    effort: high
    escalate: {after: 2, on: [ci_fail], to: {model: claude-opus-5-5, effort: high}, also_when: "plus de 5 modules touchés"}
    constraint: "un seul agent sur contrat-appgen avant T-214"
    rationale: "Python multi-fichiers couvert par des tests ; Sonnet suffit tant que la CI est le juge."
    status: hypothesis
  - id: R07-ci-github-actions
    match: {lane: [ci], paths: [".github/**", "tools/ci/**"]}
    model: claude-sonnet-5-5
    effort: high
    review: {model: claude-opus-5-5, effort: high, when: "le chemin touche un script de garde d'un job requis (noyau, CONSENSUS §1)"}
    escalate: {after: 2, on: [ci_fail], to: {model: claude-opus-5-5, effort: high}}
    rationale: "YAML et shell vérifiables (yamllint, shellcheck) ; la revue Opus ne s'ajoute que pour le noyau."
    status: hypothesis
  - id: R08-manifestes-k8s-openchoreo
    match:
      lane: [openchoreo, plateforme, socle-oke, k8s-os, hybride, homelab, stateful, sauvegardes, exposition, moteur-plain]
      paths: ["platform/**", "clusters/**", "apps/**/values.yaml"]
    model: claude-sonnet-5-5
    effort: high
    escalate: {after: 2, on: [ci_fail], to: {model: claude-opus-5-5, effort: high}}
    rationale: "Objets OpenChoreo v1.3.3 : l'agent charge les skills du dépôt ; k3d et appgen jugent. Opus après 2 échecs."
    status: hypothesis
  - id: R09-app-yaml-archetype-A
    match: {paths: ["apps/*/app.yaml"], class: [AUTONOME], keywords: [déploie, ajoute, "archétype A"]}
    model: claude-haiku-5-5
    effort: medium
    escalate: {after: 1, on: [ci_fail], to: {model: claude-sonnet-5-5, effort: high}}
    rationale: "Un app.yaml validé par schéma et appgen : l'échec est détecté par la CI à coût nul ; Haiku coûte ≈ 5 % de Sonnet. Hypothèse à tester en MOD-7 (banc T-044), avec deepseek-flash (38,5 % à TB 4.1, 5x moins cher) comme candidat MOD-12."
    status: hypothesis
  - id: R10-code-simple
    match: {lane: [preuve, connaissance, données, donnees, cout, coût, alertes, intention], keywords: [script, lint, check, schéma, "test"], kind: [code]}
    model: claude-sonnet-5-5
    effort: medium
    escalate: {after: 2, on: [ci_fail], to: {model: claude-sonnet-5-5, effort: high}, then: {model: claude-opus-5-5, effort: high}}
    rationale: "Python/YAML court avec tests ; effort `medium` d'abord, car l'effort pilote la consommation de quota."
    status: hypothesis
  - id: R11-redaction-tickets
    match: {kind: [ticket-writing]}
    model: claude-haiku-5-5
    effort: medium
    escalate: {after: 1, on: [lint_backlog_fail], to: {model: claude-sonnet-5-5, effort: medium}}
    rationale: "Sortie structurée (FORMAT.md) contrôlée par check.py ; tâche de classification et d'extraction, cœur de cible de Haiku."
    status: hypothesis
  - id: R12-recherche-documentation
    match: {kind: [research, doc]}
    model: claude-sonnet-5-5
    effort: medium
    variants: [{when: "fiche ou README simple, sources fournies", model: claude-haiku-5-5, effort: medium}]
    escalate: {after: 1, on: [unproven_hypothesis], to: {model: claude-opus-5-5, effort: high}, note: "sources contradictoires ou synthèse d'ADR"}
    rationale: "Lecture de sources et synthèse : qualité du raisonnement, peu de code."
    status: hypothesis
  - id: R13-revue-de-code
    match: {kind: [review]}
    model: claude-sonnet-5-5
    effort: high
    variants: [{when: "classe REVUE ou MANDAT, ou chemin de noyau", model: claude-opus-5-5, effort: high}]
    escalate: {after: 1, on: [blocking_finding_missed], to: {model: claude-opus-5-5, effort: high}}
    rationale: "Revue AUTONOME = filet à bas coût ; REVUE/MANDAT = dernier filet avant Paul."
    status: hypothesis
  - id: R14-banc-intentions
    match: {kind: [bench], lane: [intention]}
    model: claude-sonnet-5-5
    effort: high
    calibration: {matrix: [claude-haiku-5-5, claude-sonnet-5-5, claude-opus-5-5], runs_per_cell: 5}
    judge: none   # preuve runtime déterministe (PASS/FAIL des scripts), pas de juge LLM
    rationale: "Le banc mesure le modèle réellement utilisé en production ; la matrice sert à étalonner toutes les règles."
    status: hypothesis
  - id: R15-veille-releases
    match: {kind: [watch], lane: [veille, renovate]}
    model: claude-haiku-5-5
    effort: low
    candidates: [{provider: deepseek, model: deepseek-flash, via: agentgateway, data: public-repo, schedule: "hors 06-10 h UTC en semaine", status: sourced}]
    escalate: {after: 1, on: [breaking_change_flagged], to: {model: claude-sonnet-5-5, effort: high}}
    rationale: "Résumé de notes de version publiques ; volume élevé, risque faible."
    status: hypothesis
  - id: R16-service-ia-interne
    match: {kind: [internal-ai]}
    via: agentgateway          # clé virtuelle + allowedModels + budget bloquant (ADR-0018)
    data_sensitive:  {provider: anthropic, model: claude-haiku-5-5, effort: low}
    data_public:     {provider: deepseek, model: deepseek-flash, thinking: high, status: sourced}
    excluded:        {provider: deepseek, model: deepseek-v4-pro, why: "Terminal-Bench 4.1 : 6,7 % ; concurrence 500 ; sans vision"}
    failover: {anthropic: claude-haiku-5-5, deepseek: deepseek-flash}
    escalate: {after: 1, on: [quality_below_threshold], to: {model: claude-sonnet-5-5, effort: medium}}
    rationale: "Haiku 5.5 (0,10/0,50) et deepseek-flash (0,15/0,60 creux ; cache 0,003) coûtent autant par session (≈0,11 $) et valent 40,0 / 38,5 % à TB 4.1 : DeepSeek sert l'indépendance de quota et la bascule. Données sensibles : Haiku seulement."
    status: hypothesis
  - id: R99-defaut
    match: {}
    model: claude-sonnet-5-5
    effort: high
    escalate: {after: 2, on: [ci_fail], to: {model: claude-opus-5-5, effort: high}}
    rationale: "Défaut : moitié du prix de liste d'Opus au token ; mais à effort max Sonnet consomme 2,4x plus de tokens (TB 4.1 : 63,9 % pour 7,3 k$ contre 65,8 % pour 4,7 k$ pour Opus). MOD-7 tranche Sonnet high contre Opus medium sur le quota par ticket fusionné."
    alt_to_test: {model: claude-opus-5-5, effort: medium}
    status: hypothesis

tickets:
  - key: MOD-1
    title: "ADR-0021 Routage des modèles par tâche (proposé, à acter par Paul)"
    phase: P0
    stage: S0
    model: claude-sonnet-5-5
    adr: ["NEW-MODELS"]
    depends_on: ["T-061"]
    class: MANDAT
    velocity: true
    parallel_lane: "gouvernance"
    scope: "docs/adr/0021-routage-des-modeles.md, docs/adr/README.md"
    intent: "Reprendre le texte de docs/research/MODEL-ROUTING.md §7 au gabarit des ADR ; Paul l'acte par la PR (docs/adr/ est dans le noyau)."
    done:
      - "ADR-0021 PROPOSÉ au gabarit, ajouté à la table de docs/adr/README.md"
      - "Paul a tranché : plancher Opus du noyau, Fable sur demande seulement, DeepSeek Flash sur données publiques (MANDAT de dépense)"
    notes: "Sans cet ADR, MOD-2 à MOD-8 restent en proposition."
  - key: MOD-2
    title: "En-tête de ticket : champs `model` et `effort`, validés par check.py"
    phase: P0
    stage: S0
    model: claude-sonnet-5-5
    adr: ["NEW-MODELS", "0012"]
    depends_on: ["T-008", "MOD-1"]
    class: REVUE
    velocity: true
    parallel_lane: "ci"
    scope: "backlog/README.md, backlog/proposals/FORMAT.md, tools/backlog/check.py, tests/backlog/"
    intent: "Ajouter `model:` (ID complet épinglé) et `effort:` facultatifs à l'en-tête ; check.py refuse un ID inconnu ou un effort non supporté."
    done:
      - "backlog/README.md documente les deux champs ; FORMAT.md reste compatible"
      - "test : `model: claude-unknown` → check.py rouge ; effort `max` sur Sonnet → avertissement (plafond xhigh)"
    notes: "tools/backlog/ est noyau (CONSENSUS décision 1) : relecture de Paul."
  - key: MOD-3
    title: "route.py : règles backlog/routing.yaml et résolution d'un modèle par ticket"
    phase: P0
    stage: S0
    model: claude-sonnet-5-5
    adr: ["NEW-MODELS"]
    depends_on: ["MOD-2"]
    class: REVUE
    velocity: true
    parallel_lane: "ci"
    scope: "backlog/routing.yaml, tools/backlog/route.py, tests/backlog/"
    intent: "Promouvoir la liste `rules:` de cette proposition en backlog/routing.yaml et écrire route.py : (ticket, kind) → {model, effort, review, escalate} ; le plancher est recalculé depuis les chemins, le champ `model` ne fait que monter."
    done:
      - "tests : 20 tickets d'exemple (un par couloir) routés comme la grille ; R01 impose Opus même si l'en-tête dit sonnet"
      - "`route.py --explain T-xxx` affiche la règle appliquée"
    notes: "Même principe que T-210 : classe recalculée, jamais lue dans l'en-tête."
  - key: MOD-4
    title: "Dispatcher : transmettre --model et --effort à claude-code-action, et gérer l'escalade"
    phase: P0
    stage: S0
    model: claude-sonnet-5-5
    adr: ["NEW-MODELS"]
    depends_on: ["T-210", "MOD-3"]
    class: REVUE
    velocity: true
    parallel_lane: "ci"
    scope: ".github/workflows/claude-agent.yml, tools/backlog/next.py"
    intent: "Entrées `model` et `effort` de workflow_dispatch passées à `claude_args` (--model, --effort) ; relance d'un cran au-dessus après les échecs prévus par la règle, avec l'étiquette `escalated-from`."
    done:
      - "run de test : la session s'exécute sur le modèle demandé (preuve : modèle consigné dans la sortie result)"
      - "deux échecs CI simulés → relance au cran suivant, une seule fois par cran ; au-delà : issue `needs-human`"
    notes: "Le workflow est noyau (script de garde) : relecture Opus adverse (R07). Le jeton d'abonnement reste CLAUDE_CODE_OAUTH_TOKEN (aucune clé API sans MANDAT)."
  - key: MOD-5
    title: "Attribution : trailers Model/Effort/Escalated-from et enregistrement de l'usage par PR"
    phase: P1
    stage: S1
    model: claude-sonnet-5-5
    adr: ["NEW-MODELS", "0011"]
    depends_on: ["MOD-4"]
    class: AUTONOME + REVUE
    velocity: true
    parallel_lane: "preuve"
    scope: ".github/pull_request_template.md, tools/metrics/model-routing/collect.py, docs/schema/"
    intent: "Chaque PR d'agent porte Model, Effort, Escalated-from ; collect.py lit ces trailers et l'usage (tokens, tours, durée) de la sortie result, sans contenu de prompt."
    done:
      - "schéma `model-run.v1` (ticket, modèle, effort, échecs CI, escalades, tokens, durée, issue) ; aucun prompt stocké"
      - "10 PR réelles collectées, preuve datée"
    notes: "Complète T-043 (mission-result.v1) et T-209 (coût LLM par agent, différé) ; ne pas dupliquer : réutiliser leur schéma si publié."
  - key: MOD-6
    title: "Rapport hebdomadaire par (type de tâche, modèle) : réussite, escalades, quota par PR"
    phase: P1
    stage: S3
    model: claude-sonnet-5-5
    adr: ["NEW-MODELS"]
    depends_on: ["MOD-5"]
    class: AUTONOME
    velocity: false
