  intent: "Définir le mandat de lot (étape, tickets, chemins, plafond de diff et de dépense, expiration, conditions) signé par PR dans le noyau, et étendre l'App de T-215 aux permissions de dispatch et de merge sous conditions."
  done:
    - "schéma `mandate.v1` + validateur ; un mandat expiré ou hors liste de chemins est refusé (test négatif)"
    - "App : permissions listées (Contents RW, Pull requests RW, Actions RW, Metadata R), installée sur ce dépôt seul ; essai : une PR du noyau ouverte par l'App n'est pas fusionnable"
    - "essai daté : une session cloud ouvre une PR du noyau ; l'identité de l'auteur et la non-fusionnabilité sont consignées"
  notes: "MANDAT : création de l'App et option « Allow auto-merge » par Paul. Le mandat n'ouvre jamais secret, accès, dépense hors free tier, apply, INTERDIT (platform-guardrails §1-2)."
