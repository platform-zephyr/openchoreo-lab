  scope: "ops/workers/ (compose, scripts de bootstrap), docs/AGENT-RUNNERS.md"
  intent: "VM Proxmox dédiée (environ 8 vCPU, 32 Go, VLAN isolé) ; un travailleur interroge GitHub en sortant, prend un ticket affecté, exécute claude -p dans un worktree conteneurisé détruit après le job ; aucun kubeconfig, aucun identifiant de production ; pas de runner Actions enregistré sur ce dépôt public."
  done:
