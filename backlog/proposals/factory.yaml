    - "mesure : mémoire et CPU pour N jobs simultanés, N maximal consigné"
    - "preuve que claude -p avec CLAUDE_CODE_OAUTH_TOKEN s'authentifie par l'abonnement (/status) : PASS/FAIL daté"
    - "décision écrite : runner Actions sur le homelab seulement si le dépôt devient privé"
  notes: "MANDAT : création de la VM et du réseau (homelab-infra possède Proxmox : suivre ses règles). GitHub déconseille les runners auto-hébergés sur dépôt public (docs secure-use, lue le 2026-11-18) et les minutes hébergées y sont gratuites : gain faible, risque élevé. Les environnements auto-hébergés officiels sont Team/Enterprise."
