    - "app cassée en dev : alerte reçue en moins de 10 minutes, datée"
    - "homelab éteint 10 min : aucune alerte applicative, une alerte info"
  notes: "MANDAT : apply de la racine (ARC refuse delete). Une seule racine grafana-cloud : coordonner avec les propriétaires du dépôt homelab-infra."

