- key: OBS-6
  title: "Pont alerte -> agent : workflow remediate, dédoublonnage, budget, disjoncteur"
  phase: P1
  adr: ["NEW-OBS", "0002", "0013"]
  depends_on: ["OBS-0", "OBS-5", "T-068", "T-005"]
  class: REVUE + MANDAT
  velocity: true
  parallel_lane: "remédiation"
  scope: ".github/workflows/remediate.yml, tools/observe/, .agents/skills/fix-app/, docs/AGENT-RUNNERS.md"
  intent: "workflow_dispatch appelé par un contact point Grafana (jeton Actions-only) ; étape 1 sans agent collecte un context.json assaini (jeton Viewer), étape 2 lance fix-app via claude-code-action sans secret ; issue incident:<app>:<env>, 2 essais/app/24 h, 6 dispatches/jour, label agent:gave-up."
  done:
    - "alerte simulée : un seul job, une seule issue ; seconde alerte = commentaire, pas de job"
    - "étape agent sans secret ni jeton Grafana (test statique du workflow)"
    - "régression simulée : PR de revert ouverte, PASS runtime daté, issue close"
    - "deux échecs : agent:gave-up posé, plus de dispatch ; condition de déclenchement de claude-agent.yml amendée"
  notes: "MANDAT : création des jetons (Actions-only, Viewer) et secrets GitHub, par nom seulement. .github/ est noyau : REVUE. Absorbe la partie « PR de revert automatique » de T-065. Contexte assaini : pas de logs bruts (dépôt public)."

