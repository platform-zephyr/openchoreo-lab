# Propositions du domaine observabilité, alerting, remédiation (voir docs/research/OBSERVABILITY-OPERATIONS.md).
# ADR proposé : NEW-OBS = « Observabilité, alerting et remédiation automatique » (texte en §6 du rapport).
- key: OBS-0
  title: "Contrat d'alerte : labels, charge d'alerte, format de runbook, lint"
  phase: P0
  adr: ["NEW-OBS"]
  depends_on: ["T-072"]
  class: AUTONOME
  velocity: true
  parallel_lane: "observabilité"
  scope: "docs/schema/alert-payload.v1.json, docs/runbooks/_TEMPLATE.md, tools/observe/lint_runbooks.py, tests/"
  intent: "Fixer ce que tout le chantier partage : labels lab_app/lab_env/cluster, schéma de la charge d'alerte reçue par l'agent, front matter des runbooks (alert, severity, class, signals, checks, allowed_actions, escalate_when), et un lint qui exige un runbook par règle."
  done:
    - "schéma JSON versionné + 2 exemples valides et 2 invalides testés"
    - "gabarit de runbook et lint CI : une règle d'alerte sans runbook échoue"
    - "cause.type (retryable/à corriger/plateforme) ajouté au schéma app-status.v1 sans casser T-072"
  notes: "Débloque OBS-4, OBS-6, OBS-7, OBS-8 en parallèle."

