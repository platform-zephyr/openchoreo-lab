# Agents de développement sur runners GitHub (anthropics/claude-code-action, épinglé par SHA, tag v1).
# Un label `agent:dev` posé PAR PAUL sur une issue = un job = un agent = une branche claude/* = une PR.
# L'agent n'a AUCUN accès OKE/Doppler/OCI : seul le contenu du dépôt et le jeton de l'App Claude (courte durée,
# ce dépôt seulement). Déploiement = merge puis Argo CD ; la preuve runtime reste au coordinateur.
# Gouverneur (T-311) : kill-switch factory/PAUSE, matrice max-parallel 3 (factory/config.yaml), dispatch manuel du pilote.
# Sécurité : déclencheur restreint à l'acteur propriétaire (une issue publique ne suffit pas), concurrence par issue,
# pas de show_full_output (dépôt public : les journaux sont publics), pas de secret autre que le jeton Claude.
# docs/AGENT-RUNNERS.md : mise en route.
name: claude-agent
on:
  issues:
    types: [labeled]
  # Pilote (ADR-0021) : Paul lance une liste d'issues ; la matrice les execute 3 a la fois (max-parallel).
  workflow_dispatch:
    inputs:
      tickets:
        description: "Numeros d'issues (virgules ou espaces), 20 au plus"
        required: true
        type: string

permissions:
  contents: read

# Gouverneur (T-311, ADR-0021). Pas de groupe de concurrence au niveau du workflow : un groupe unique n'admet qu'un run
# actif et un en attente et annule le suivant (docs.github.com, « Control the concurrency of workflows and jobs »).
# - Kill-switch : factory/PAUSE sur main = aucun agent lance (job plan, puis re-controle dans chaque job de la matrice).
# - Concurrence 3 : `max-parallel: 3` sur la matrice ; les issues au-dela attendent, aucune n'est annulee.
# - Une issue ne tourne qu'une fois a la fois : groupe par issue au niveau du job, sans annulation.
jobs:
  plan:
    if: github.actor == 'SmadjaPaul' && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:dev')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      paused: ${{ steps.pause.outputs.paused }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Kill-switch factory/PAUSE
        id: pause
        run: factory/pause-check.sh || [ "$?" -eq 10 ]
      - name: Matrice des issues
        id: matrix
        if: steps.pause.outputs.paused == 'false'
        env:
          TICKETS: ${{ inputs.tickets }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: factory/plan-matrix.sh

  dev:
    needs: plan
    if: needs.plan.outputs.paused == 'false'
    name: "dev issue ${{ matrix.issue }}"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: claude-agent-issue-${{ matrix.issue }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Kill-switch factory/PAUSE (re-controle sur origin/main)
        id: pause
        env:
          PAUSE_REF: origin/main
        run: factory/pause-check.sh || [ "$?" -eq 10 ]
      - if: steps.pause.outputs.paused == 'false'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Outils de test statique (aucun accès cluster)
        if: steps.pause.outputs.paused == 'false'
        run: python3 -m pip install --disable-pip-version-check -r tools/appgen/requirements.txt "yamllint==1.38.0"
      - if: steps.pause.outputs.paused == 'false'
        uses: anthropics/claude-code-action@469588f42e6b1e94cd14ad09dccfeaec772ce0fd # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "agent:dev"
          prompt: "Traite l'issue #${{ matrix.issue }} de ce dépôt (lis-la avec gh issue view ${{ matrix.issue }}) selon AGENTS.md."
          base_branch: main
          branch_prefix: "claude/"
          claude_args: |
            --max-turns 60
            --allowedTools "Edit,Read,Write,Glob,Grep,Bash(python3:*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(factory/pause-check.sh:*),Bash(yamllint:*),Bash(shellcheck:*)"
            --append-system-prompt "Lis AGENTS.md, STATE.md et docs/AGENT-PR-MODEL.md. Si factory/PAUSE existe sur origin/main, ne lance aucun merge automatique (factory/pause-check.sh) et arrête-toi. Aucun accès cluster ni secret. Une PR par issue, périmètre de fichiers de l'issue seulement ; apps/**, generated/** (via appgen) libres ; platform/, tools/, tests/, .github/ exigent l'approbation de Paul. N'appelle jamais kubectl/helm vers un cluster. Ouvre la PR avec les commandes exécutées, leurs résultats et ce qui reste NOT_TESTED."
