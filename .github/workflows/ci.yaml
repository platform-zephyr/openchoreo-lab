# CI du labo OpenChoreo. Permissions minimales, aucun secret, actions epinglees par SHA de commit.
# Le job ci-ok est le seul check requis par la protection de branche (tools/apply-branch-protection.sh).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versions et empreintes verifiees (gh release download + sha256sum). Ne pas modifier sans revoir les empreintes.
  KUBECONFORM_VERSION: "0.7.0"
  KUBECONFORM_SHA256: "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  # OpenChoreo v1.3.3 : tag v1.3.3 -> commit 5336791f421b3efb79603b09b8ce0c98e8ef077d (gh api, verifie).
  OPENCHOREO_COMMIT: "5336791f421b3efb79603b09b8ce0c98e8ef077d"

jobs:
  yamllint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Installer yamllint (version figee)
        run: python3 -m pip install --disable-pip-version-check "yamllint==1.38.0"
      - name: yamllint
        run: yamllint -c tools/appgen/yamllint.yaml apps tools tests .github

  appgen:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Dependances appgen (figees)
        run: python3 -m pip install --disable-pip-version-check -r tools/appgen/requirements.txt
      - name: Validation schema et regles (apps/*, apps/_examples/*)
        run: python3 tools/appgen/appgen.py validate
      - name: Tests unitaires et cas negatifs
        run: python3 -m unittest discover -s tests/appgen -v
      - name: Pas de derive (render doit ne rien modifier)
        run: python3 tools/appgen/appgen.py check

  crd-schema:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Dependances appgen (figees)
        run: python3 -m pip install --disable-pip-version-check -r tools/appgen/requirements.txt
      - name: CRD OpenChoreo v1.3.3 (commit fige, config/crd/bases uniquement)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openchoreo/openchoreo
          ref: ${{ env.OPENCHOREO_COMMIT }}
          sparse-checkout: config/crd/bases
          path: openchoreo-upstream
          persist-credentials: false
      - name: Installer kubeconform (archive verifiee par sha256)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      - name: Rendu puis validation kubeconform -strict contre les CRD v1.3.3
        run: |
          set -euo pipefail
          python3 tools/appgen/appgen.py render --out "$RUNNER_TEMP/generated"
          tools/appgen/validate-crd.sh openchoreo-upstream/config/crd/bases "$RUNNER_TEMP/generated"
      - name: Cas negatif kubeconform (valeur invalide doit etre refusee)
        run: tests/appgen/kubeconform-negative.sh openchoreo-upstream/config/crd/bases

  secrets:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer gitleaks (archive verifiee par sha256)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Detection de secrets (historique complet, valeurs masquees)
        run: gitleaks git --redact --no-banner --log-level warn .

  actionlint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer actionlint (archive verifiee par sha256)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      - name: actionlint
        run: actionlint

  charts:
    # Charts Helm locaux : aucun pour l'instant (le parcours helm pointe des charts OCI externes).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recherche de charts locaux
        run: |
          if [ -z "$(find . -name Chart.yaml -not -path './.git/*' -print -quit)" ]; then
            echo "aucun chart local : helm lint/template non requis"
          else
            echo "charts locaux detectes : ajouter helm lint/template a ce job (version figee)" >&2
            exit 1
          fi

  ci-ok:
    # Check requis par la protection de branche : echoue si un job amont n'est pas en success.
    if: always()
    needs: [yamllint, appgen, crd-schema, secrets, actionlint, charts]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Agregation
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -q '"result": "\(failure\|cancelled\|skipped\)"'; then
            echo "au moins un job requis a echoue" >&2
            exit 1
          fi
