# CI du labo OpenChoreo. Permissions minimales, aucun secret (sauf LEAK_GUARD_EXTRA_PATTERNS, facultatif, job leak-guard), actions epinglees par SHA de commit.
# Le job ci-ok est le seul check requis par la protection de branche (tools/apply-branch-protection.sh).
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# Un nouveau push sur une PR annule le run obsolete de la meme PR. Sur main (push) et dans la file de fusion
# (merge_group, ref unique par groupe), aucun run n'est annule : chaque commit fusionne garde son verdict post-merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Binaires linux-arm64 (runners ubuntu-24.04-arm). gitleaks/actionlint: empreintes = digests publies des releases GitHub ; kubeconform: empreinte calculee localement (pas de digest publie). Ne pas modifier sans revoir les empreintes.
  KUBECONFORM_VERSION: "0.7.0"
  KUBECONFORM_SHA256: "cc907ccf9e3c34523f0f32b69745265e0a6908ca85b92f41931d4537860eb83c"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
  # helm v4.1.3 linux-arm64 : sha256 publie (get.helm.sh/helm-v4.1.3-linux-arm64.tar.gz.sha256sum et notes de la
  # release GitHub helm/helm v4.1.3), egal au shasum -a 256 de l'archive telechargee (2026-11-17).
  HELM_VERSION: "v4.1.3"
  HELM_SHA256: "5db45e027cc8de4677ec869e5d803fc7631b0bab1c1eb62ac603a62d22359a43"
  # yq v4.50.1 linux-arm64 : digest de l'asset de la release GitHub mikefarah/yq (gh api), egal au shasum local.
  YQ_VERSION: "4.50.1"
  YQ_SHA256: "cf0a663d8e4e00bb61507c5237b95b45a6aaa1fbedac77f4dc8abdadd5e2b745"
  # OpenChoreo v1.3.3 : tag v1.3.3 -> commit 5336791f421b3efb79603b09b8ce0c98e8ef077d (gh api, verifie).
  OPENCHOREO_COMMIT: "5336791f421b3efb79603b09b8ce0c98e8ef077d"

jobs:
  yamllint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Installer yamllint (version figee)
        run: python3 -m pip install --disable-pip-version-check "yamllint==1.38.0"
      - name: yamllint
        run: yamllint -c tools/appgen/yamllint.yaml apps tools tests .github

  appgen:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Dependances appgen (figees)
        run: python3 -m pip install --disable-pip-version-check -r tools/appgen/requirements.txt
      - name: Validation schema et regles (apps/*, apps/_examples/*)
        run: python3 tools/appgen/appgen.py validate
      - name: Tests unitaires et cas negatifs
        run: python3 -m unittest discover -s tests/appgen -v
      - name: Pas de derive (render doit ne rien modifier)
        run: python3 tools/appgen/appgen.py check
      - name: Registre des identites (schema, aucune valeur) et tests du lint
        run: |
          python3 -I tools/backlog/identities_lint.py
          python3 -m unittest discover -s tests/identities -v

  crd-schema:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Dependances appgen (figees)
        run: python3 -m pip install --disable-pip-version-check -r tools/appgen/requirements.txt
      - name: CRD OpenChoreo v1.3.3 (commit fige, config/crd/bases uniquement)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openchoreo/openchoreo
          ref: ${{ env.OPENCHOREO_COMMIT }}
          sparse-checkout: config/crd/bases
          path: openchoreo-upstream
          persist-credentials: false
      - name: Installer kubeconform (archive verifiee par sha256)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-arm64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-arm64.tar.gz" | sha256sum -c -
          tar -xzf kubeconform-linux-arm64.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      - name: Rendu puis validation kubeconform -strict contre les CRD v1.3.3
        run: |
          set -euo pipefail
          python3 tools/appgen/appgen.py render --out "$RUNNER_TEMP/generated"
          tools/appgen/validate-crd.sh openchoreo-upstream/config/crd/bases "$RUNNER_TEMP/generated"
      - name: Cas negatif kubeconform (valeur invalide doit etre refusee)
        run: tests/appgen/kubeconform-negative.sh openchoreo-upstream/config/crd/bases

  secrets:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer gitleaks (archive verifiee par sha256)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Detection de secrets (historique complet, regles par defaut, valeurs masquees)
        # Config explicite : sans elle gitleaks charge .gitleaks.toml (regles OCID/IPv4/e-mail/chemin de la garde T-303,
        # appliquees a l'arbre par le job leak-guard) et ferait echouer sur l'historique deja publie.
        run: |
          printf '[extend]\nuseDefault = true\n' >"$RUNNER_TEMP/gitleaks-default.toml"
          gitleaks git --config "$RUNNER_TEMP/gitleaks-default.toml" --redact --no-banner --log-level warn .

  leak-guard:
    # Garde de donnees sensibles du depot public (T-303) : OCID Oracle, IPv4 non documentaire, e-mail hors noreply,
    # chemin /Users/<nom>, hote interne, jeton. Meme script qu'en local et dans le hook Stop (tools/dev/leak-guard.sh).
    # Les motifs propres au proprietaire (domaine, nom, e-mail) viennent du secret LEAK_GUARD_EXTRA_PATTERNS, jamais du
    # depot ; absent (PR de fork, secret non cree) : regles generiques seules, avertissement INFO, le job reste requis.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer gitleaks (archive verifiee par sha256)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: shellcheck du script et de ses tests
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck -x -P SCRIPTDIR tools/dev/leak-guard.sh tests/leak-guard/run.sh
      - name: Tests (cas negatifs et positifs, absence de valeur en sortie, motif propre absent)
        # Sans le secret : les tests fixent eux-memes les motifs dont ils ont besoin.
        run: env -u LEAK_GUARD_EXTRA_PATTERNS tests/leak-guard/run.sh
      - name: Garde sur l'arbre (motifs generiques + motifs du proprietaire si le secret existe)
        # Le secret n'est expose qu'a cette etape (jamais aux tests, jamais aux PR de fork).
        env:
          LEAK_GUARD_EXTRA_PATTERNS: ${{ secrets.LEAK_GUARD_EXTRA_PATTERNS }}
        run: tools/dev/leak-guard.sh

  actionlint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer actionlint (archive verifiee par sha256)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_arm64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_arm64.tar.gz" | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_arm64.tar.gz" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      - name: actionlint
        run: actionlint

  charts:
    # Charts Helm locaux : aucun pour l'instant (le parcours helm pointe des charts OCI externes).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recherche de charts locaux
        run: |
          if [ -z "$(find . -name Chart.yaml -not -path './.git/*' -print -quit)" ]; then
            echo "aucun chart local : helm lint/template non requis"
          else
            echo "charts locaux detectes : ajouter helm lint/template a ce job (version figee)" >&2
            exit 1
          fi

  platform:
    # Garde-fous de platform/** et tools/oke/** (revue PR #8, P1 ; flux A2, docs/ARGO-ESCALATION.md) : regles Argo
    # (argo_guard + cas negatifs, dont la separation par source lab-apps/lab-platform/lab-authz/lab-root),
    # cellule restreinte, yamllint, shellcheck. Aucun secret, aucun cluster. docs/CI-PLATFORM-CHECKS.md.
    # Les rendus Helm, le security bundle, les gardes uninstall.sh et kubeconform sont dans `platform-render`,
    # en parallele (docs/research/CI-SPEED.md) ; les deux jobs sont dans ci-ok.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Outils (versions figees)
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "yamllint==1.38.0" "PyYAML==6.0.2"
          # ShellCheck : image du runner, sinon apt.
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck --version | head -2
      - name: yamllint (platform hors component-types, tools/oke, tests/argo-guard)
        run: |
          yamllint -c tools/appgen/yamllint.yaml platform/install platform/authz platform/policies platform/data \
            platform/traits platform/project-types platform/resource-types platform/cluster-agent \
            platform/identity platform/portal tools/oke tests/argo-guard tests/argo-escalation
      - name: shellcheck et bash -n
        run: |
          shellcheck -x -P SCRIPTDIR tools/oke/*.sh tests/argo-guard/*.sh tests/argo-escalation/*.sh tests/security-bundle/*.sh tests/cell-cpt/*.sh
          for f in tools/oke/*.sh tests/argo-guard/*.sh tests/argo-escalation/*.sh tests/security-bundle/*.sh tests/cell-cpt/*.sh; do bash -n "$f"; done
      - name: Regles Argo (projets, chemins, whitelists nommees)
        run: python3 -I tools/oke/argo_guard.py .
      - name: Cas negatifs argo_guard (pieges hors depot, chacun refuse ; A2 lab-apps/lab-authz inclus)
        run: tests/argo-guard/run.sh
      # Les tests sur VRAI Argo (tests/argo-escalation/run.sh) exigent un cluster jetable : hors CI, preuve
      # archivee dans tests/argo-escalation/RESULTS.md (docs/ARGO-ESCALATION.md).
      - name: Cellule restreinte - RoleBinding borne + label egress-isolated (statique)
        run: tests/cell-cpt/run.sh

  platform-render:
    # Rendus Helm epingles (PSA, 0 PVC/LB, images par digest), security bundle fail-closed, gardes de uninstall.sh
    # (kubectl/helm factices), kubeconform -strict. Aucun secret, aucun cluster. Separe de `platform` pour la duree
    # (docs/research/CI-SPEED.md) ; memes commandes, meme ordre.
    runs-on: ubuntu-24.04-arm
    env:
      OKE_PHASEB_STATE: ${{ github.workspace }}/../phaseb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Cache des archives de charts et du manifest Gateway API, cle = versions.env. Sans risque d'empoisonnement :
      # fetch_chart et fetch_gw_crds (tools/oke/lib.sh) reverifient le sha256 epingle de chaque fichier, cache ou non.
      # Le cache de main est lisible par les PR ; celui d'une PR ne l'est que par elle-meme (portee par ref).
      - name: Cache des charts epingles (sha256 reverifie a chaque usage)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ github.workspace }}/../phaseb/charts
            ${{ github.workspace }}/../phaseb/gateway-api-*.yaml
          key: phaseb-charts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platform/install/versions.env') }}
      - name: Outils (versions figees, archives verifiees par sha256)
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "PyYAML==6.0.2"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-arm64.tar.gz"
          echo "${HELM_SHA256}  helm-${HELM_VERSION}-linux-arm64.tar.gz" | sha256sum -c -
          tar -xzf "helm-${HELM_VERSION}-linux-arm64.tar.gz" linux-arm64/helm
          sudo install -m 0755 linux-arm64/helm /usr/local/bin/helm
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-arm64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-arm64.tar.gz" | sha256sum -c -
          tar -xzf kubeconform-linux-arm64.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          curl -fsSLo yq_linux_arm64 "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_arm64"
          echo "${YQ_SHA256}  yq_linux_arm64" | sha256sum -c -
          sudo install -m 0755 yq_linux_arm64 /usr/local/bin/yq
          # jq : image du runner.
          helm version --short && kubeconform -v && yq --version && jq --version
      - name: Security bundle - refus fail-closed (sans cluster)
        # Reutilise les .tgz OpenChoreo du cache (option prevue par le script ; sha256 reverifie par fetch_chart).
        run: SECURITY_BUNDLE_CHART_CACHE="$OKE_PHASEB_STATE/charts" tests/security-bundle/run.sh
      - name: Rendus Helm epingles + psa_check + 0 PVC/LB/image sans digest
        run: tools/oke/render-check.sh
      - name: Gardes uninstall.sh (kubectl et helm factices, CRD rendues)
        run: ARGO_GUARD_CHART_CACHE="$OKE_PHASEB_STATE/charts" tests/argo-guard/uninstall-guards.sh
      - name: kubeconform -strict (platform/install/manifests et argocd)
        run: tools/oke/kubeconform-platform.sh

  release-history:
    # Les releases historiques (generated/**/releases) sont append-only : un revert ne doit pas les supprimer.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Aucune release historique supprimee
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: tests/release-history/check.sh

  dev-factory:
    # Outillage de la Development Factory (tools/dev, .devcontainer, tests/dev-factory) : statique, sans cluster ni secret.
    # Le conteneur ARM64 n'est pas construit en CI (docs/DEV-FACTORY.md) ; ici : shellcheck, yamllint, JSON, tests du garde-fou.
    runs-on: ubuntu-24.04-arm
    env:
      SHELLCHECK_VERSION: "v0.11.0"
      SHELLCHECK_SHA256: "12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Outils (versions figees, archives verifiees par sha256)
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "yamllint==1.38.0"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.aarch64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck-${SHELLCHECK_VERSION}.linux.aarch64.tar.xz" | sha256sum -c -
          tar -xJf "shellcheck-${SHELLCHECK_VERSION}.linux.aarch64.tar.xz"
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | head -2
      - name: shellcheck et yamllint de tools/dev et .devcontainer
        run: |
          set -euo pipefail
          shellcheck -x -P SCRIPTDIR tools/dev/dev tools/dev/guard-check.sh tests/dev-factory/run.sh
          yamllint -c tools/appgen/yamllint.yaml tools/dev .devcontainer
          python3 -I -m json.tool .devcontainer/devcontainer.json >/dev/null
      - name: Tests statiques (garde-fou negatif, pins, montages)
        run: tests/dev-factory/run.sh

  backlog:
    # Tickets backlog/T-*.md : en-tete, graphe, etapes, model/effort (tools/backlog/check.py, ADR-0012, ADR-0023). Stdlib seule.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tests de check.py
        run: python3 -m unittest discover -s tests/backlog -v
      - name: Controle des tickets
        run: python3 tools/backlog/check.py

  lint-code:
    # ADR-0024, T-413 : ruff (bogues F,B,E9 bloquants ; jeu complet en avertissement) et shellcheck -S warning sur tous les *.sh versionnes.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Installer ruff (version figee)
        run: python3 -m pip install --disable-pip-version-check "ruff==0.16.9"
      - name: "ruff, classe bogue (F, B, E9), 0 erreur"
        run: ruff check --select F,B,E9 tools tests
      - name: ruff, jeu complet (avertissement, ligne de base QA-4)
        continue-on-error: true
        run: ruff check --statistics tools tests
      - name: shellcheck -S warning sur tous les scripts versionnes
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

  quality:
    # ADR-0024, T-414 : cliquet de maintenabilite (tools/quality/check.py contre baseline.json). Rapide : aucun test.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Installer les outils (versions figees)
        run: python3 -m pip install --disable-pip-version-check "ruff==0.16.9" "radon==6.0.1" "mypy==2.3.1"
      - name: Tests du cliquet (degradation refusee, refactor accepte)
        run: python3 -m unittest discover -s tests/quality -v
      - name: Cliquet (aucune degradation ; seuils durs sur le code neuf)
        run: python3 tools/quality/check.py

  quality-coverage:
    # ADR-0024, T-414 : plancher de couverture (appgen.py >= 85 %, diff >= 80 %) et artefact quality.v1.json date.
    # En parallele de `quality` : la CI ne s'allonge pas (chemin critique : platform).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Installer les outils (versions figees)
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/appgen/requirements.txt \
            "ruff==0.16.9" "radon==6.0.1" "mypy==2.3.1" "coverage==7.17.3"
      - name: Tests sous couverture (appgen, backlog, identites)
        run: |
          coverage run -m unittest discover -s tests/appgen
          coverage run -a -m unittest discover -s tests/backlog
          coverage run -a -m unittest discover -s tests/identities
          coverage json -o coverage.json
      - name: Plancher de couverture, diff et quality.v1.json
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=()
          if [ -n "$BASE_REF" ]; then base=(--base "origin/$BASE_REF"); fi
          python3 tools/quality/check.py --coverage-json coverage.json --output quality.v1.json "${base[@]}"
      - name: Publier quality.v1.json
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-v1
          path: quality.v1.json
          if-no-files-found: ignore

  agent-trailers:
    # T-313 : une PR d'agent (branche claude/issue-* (usine ; la branche du coordinateur, historique non conforme, est exclue) ou agent/*, ou auteur = bot de l'executant) n'a que des commits en
    # noreply@anthropic.com avec les trailers Ticket, Model, Effort, Claude-Session (tools/factory/run-ticket.sh check-trailers).
    # Le job tourne toujours et saute les etapes par condition : un job `skipped` ferait echouer ci-ok (regle ci-dessous).
    runs-on: ubuntu-24.04-arm
    env:
      IS_AGENT_PR: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'claude/issue-') || startsWith(github.head_ref, 'agent/') || github.actor == 'openchoreo-worker[bot]') }}
    steps:
      - name: Perimetre
        run: echo "PR d'agent = $IS_AGENT_PR"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.IS_AGENT_PR == 'true'
        with:
          # Les commits de la PR, pas le commit de fusion synthetique (auteur github-actions).
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Trailers et e-mail noreply (origin/main..HEAD)
        if: env.IS_AGENT_PR == 'true'
        run: |
          git fetch --no-tags origin main
          tools/factory/run-ticket.sh check-trailers origin/main..HEAD

  ci-ok:
    # Check requis par la protection de branche : echoue si un job amont n'est pas en success.
    if: always()
    needs: [yamllint, appgen, crd-schema, secrets, leak-guard, actionlint, charts, platform, platform-render, release-history, dev-factory, backlog, lint-code, quality, quality-coverage, agent-trailers]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Agregation
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -q '"result": "\(failure\|cancelled\|skipped\)"'; then
            echo "au moins un job requis a echoue" >&2
            exit 1
          fi
