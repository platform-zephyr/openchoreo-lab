# Politique du cluster OKE (oracle-a1). Inutilisable tant que le gate OKE n'est pas franchi (appgen refuse
# cluster: oke sans --allow-oke). Lue par tools/appgen (schema : docs/schema/capabilities.schema.json).
apiVersion: platform.smadja.dev/v1alpha1
kind: ClusterCapabilities
metadata:
  name: oke
spec:
  arch: [arm64]           # A1 Ampere arm64
  availability: always
  gvisor: absent          # aucune preuve datee d'un pod sous runsc sur ce cluster
  admission: [psa, vap]   # pas de Kyverno
  # Cilium en chaînage OCI VCN-native, posé par tools/oke/install.sh --step 0 (T-494), contrôlé par verify.sh --step 0.
  cilium: true
  privateEgressCIDRs: []
  # lab-pg est admis sur OKE depuis la suppression des 2 volumes orphelins du drill (preuve datée 2026-11-18T22:31Z,
  # MANDAT 24) : CNPG demande un PVC oci-bv (>= 50 Go). Capacité de bloc : boot 50 Go + lab-pg 50 Go = 100 Go sur 200 Go,
  # la marge de remplacement du worker (50 Go) reste libre. Sans sauvegarde : OKE est jetable (D-2026-11-18-01).
  databaseInstances:
    lab-pg: {resourceType: cnpg-lab-db, namespace: lab-pg, cluster: lab-pg, backup: none}
    # pg-shared n'est PAS admis : aucune restauration hors Oracle prouvee (D-2026-11-14-03).
    # Pour l'admettre (PR plateforme) : pg-shared: {resourceType: cnpg-shared-db, namespace: <ns>, cluster: pg-shared, backup: cnpg}
  identityProviders: [thunderid]
  # Volumes persistants admis : StorageClass oci-bv (50 Go minimum par volume, facturation au minimum). Jamais Longhorn
  # sur OKE ; pas de RWX. Tout volume au-delà de lab-pg reste une décision de Paul (quota de 200 Go, marge de 50 Go).
  storageClasses:
    block-rwo: oci-bv
  backupMechanisms: [none]
  secretStore: lab-store
  # lab-store = fournisseur ESO kubernetes (platform/install/manifests/20-eso-lab-store.yaml) : remoteRef.key = Secret
  # minuscule de lab-secrets (cle SEARXNG_SECRET -> Secret searxng-secret), property = cle (T-499).
  secretStoreProvider: kubernetes
