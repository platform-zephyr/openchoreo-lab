# Politique du cluster OKE (oracle-a1). Inutilisable tant que le gate OKE n'est pas franchi (appgen refuse
# cluster: oke sans --allow-oke). Lue par tools/appgen (schema : docs/schema/capabilities.schema.json).
apiVersion: platform.smadja.dev/v1alpha1
kind: ClusterCapabilities
metadata:
  name: oke
spec:
  # Cible du gate : Cilium en chaining (aujourd'hui FLANNEL_OVERLAY, qui n'applique pas les NetworkPolicy [C]).
  cilium: true
  privateEgressCIDRs: []
  databaseInstances:
    lab-pg: {resourceType: cnpg-lab-db, namespace: lab-pg, cluster: lab-pg, backup: none}
    # pg-shared n'est PAS admis : aucune restauration hors Oracle prouvee (D-2026-11-14-03).
    # Pour l'admettre (PR plateforme) : pg-shared: {resourceType: cnpg-shared-db, namespace: <ns>, cluster: pg-shared, backup: cnpg}
  identityProviders: [thunderid]
  storageClasses:
    block-rwo: oci-bv       # 50 Gi minimum factures ; jamais Longhorn sur OKE ; pas de RWX (FSS non provisionne)
  backupMechanisms: [none]
  secretStore: lab-store
