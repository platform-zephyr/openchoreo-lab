# SOURCE (copie versionnée, T-494) : dépôt public SmadjaPaul/kube-ops, PR #1620,
# commit 1ecb02f8da18ca986aa5178633b1e97c9ac4ed93, fichier k8s/clusters/oracle-a1/bootstrap/cilium-values.yaml.
# Licence MIT (NOTICE). Sous ce bloc : contenu amont NON modifié (contrôle : tools/oke/baseline-source.sh).
# Chart cilium (CILIUM_* de versions.env), release cilium, namespace kube-system : tools/oke/install.sh --step 0.
# Valeurs = guide amont « Cilium CNI chaining, OKE VCN-Native Pod Networking » (cni.chainingTarget=oci).
# Cilium en chaining sur OKE VCN-native (ADR oke-target-architecture §1, §4 option A).
# Doc Cilium "CNI chaining Oracle OKE" : cni.chainingTarget=oci, exclusive=false,
# routingMode native, pas de masquerade, kube-proxy conserve.
# Version identique au homelab (k8s/infrastructure/network/cilium : 1.20.4).
# Le CNI OCI (vcn-native-ip-cni) reste proprietaire de l'attribution d'IP des pods :
# ipam.mode reste "cluster-pool" pour satisfaire le chart, sans CIDR routable.
cni:
  chainingTarget: oci
  exclusive: false
routingMode: native
enableIPv4Masquerade: false
kubeProxyReplacement: false
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 100.64.0.0/16

# Policies : NetworkPolicy standard + CiliumNetworkPolicy (FQDN) sont appliquees.
policyEnforcementMode: default

# A1 : 1830m / 8,4 GiB allouables au total pour le noeud unique.
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 384Mi}
operator:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 128Mi}

# Hubble desactive : relay et UI consomment ~130 Mi et un port 4245 supplementaire ;
# les policies ne dependent pas de Hubble. Reactivation possible via PR dediee.
hubble:
  enabled: false
prometheus:
  enabled: false
envoy:
  enabled: false
gatewayAPI:
  enabled: false
ingressController:
  enabled: false
l2announcements:
  enabled: false
