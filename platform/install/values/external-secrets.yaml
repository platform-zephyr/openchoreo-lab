# External Secrets Operator 2.0.1. Chart : oci://ghcr.io/external-secrets/charts/external-secrets
# --version 2.0.1. Namespace : openchoreo-external-secrets (non imposé).
# OBLIGATOIRE pour le labo (E-revue K4) : le CRT cnpg-lab-db rend un générateur Password, des
# ExternalSecret et un PushSecret vers ${dataplane.secretStore} ; le CCT rend des ExternalSecret.
# Store : ClusterSecretStore `lab-store` (provider kubernetes, namespace lab-secrets), voir
# manifests/20-eso-lab-store.yaml : secrets générés dans le cluster, aucun jeton externe ni admin partagé.
#
# Minimal : pas de webhook de validation ni de cert-controller (2 pods et 2 IP VCN en moins). Les CRD
# ESO 2.0.1 n'ont qu'une version et pas de conversion webhook (crds.conversion.enabled=false) : le
# contrôleur fonctionne sans. On perd seulement la validation à l'admission des SecretStore et
# ExternalSecret (le schéma OpenAPI des CRD reste appliqué). Réactivable sans migration.
# Mesure k3d : 3 pods = 5m et 109 Mi ; contrôleur seul estimé ≤ 64 Mi [S] (à confirmer par measure.sh).
installCRDs: true
image:
  tag: "v2.0.1@sha256:e4ca217803202017da604dc2e7627d37c32ed57bd70e34585dbcd39b065ea23f"
webhook:
  create: false
certController:
  create: false
resources:
  requests: {cpu: 5m, memory: 64Mi}
  limits: {cpu: 200m, memory: 256Mi}
serviceMonitor:
  enabled: false
