# ResourceQuota + LimitRange par namespace d'essai (Phase B). Valeurs = somme des requests des values
# épinglées (platform/install/values/*.yaml) + marge ; LoadBalancer et NodePort interdits partout
# (APP-CONTRACT §9 : aucun LB OCI, exposition future par Cloudflare Tunnel vers un Service ClusterIP).
# LimitRange : défauts pour les conteneurs sans resources (Jobs des charts), sinon refus par le quota.
# Les cellules dp-* reçoivent leurs quotas du CPT cell-restricted, pas d'ici.
---
# openchoreo-control-plane : controller-manager 15m/64Mi, openchoreo-api 10m/48Mi, cluster-gateway 5m/24Mi, kgateway 10m/96Mi = 40m/232Mi,
# + portail backstage 10m/320Mi (étape 6b, docs/PORTAL.md §2) = 50m/552Mi ; Job authz-bootstrap (défauts LimitRange 10m/32Mi).
# Limites : 384+256+128+256+768 = 1792Mi (+128Mi du Job) <= 2304Mi.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-quota
  namespace: openchoreo-control-plane
  labels: {app.kubernetes.io/part-of: openchoreo-lab}
spec:
  hard:
    requests.cpu: "100m"
    requests.memory: "640Mi"
    limits.memory: "2304Mi"
    pods: "8"
    persistentvolumeclaims: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: lab-defaults
  namespace: openchoreo-control-plane
  labels: {app.kubernetes.io/part-of: openchoreo-lab}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 10m, memory: 32Mi}
      default: {cpu: 200m, memory: 128Mi}
      max: {cpu: "1", memory: 1Gi}
---
