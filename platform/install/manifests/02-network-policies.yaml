# Réseau des namespaces d'essai (Phase B), appliqué par Cilium 1.20.4 (chaining OCI VCN-native).
# Modèle : default-deny ingress+egress par namespace, puis ouvertures nominatives (DNS, kube-apiserver,
# flux internes listés dans docs/PHASE-B.md §3). Aucun egress Internet, sauf Argo -> github.com:443.
# Les pulls d'images (ghcr.io, quay.io, cr.kgateway.dev, registry.k8s.io, ecr-public) sont faits par
# cri-o sur le nœud, hors réseau de pod : aucune règle FQDN de registre n'est nécessaire.
#
# kube-apiserver : CiliumNetworkPolicy toEntities/fromEntities (un ipBlock ne sélectionne pas l'identité
# réservée kube-apiserver ; endpoint privé OKE 10.0.2.65:6443, Service kubernetes 443).
# Webhooks (cert-manager :10250, controller-manager OpenChoreo :9443, CNPG :9443) : ingress depuis
# l'entité kube-apiserver. [S] à prouver sur OKE (verify.sh) : identité vue par Cilium pour les appels
# du control plane managé. Repli minimal si refus : fromCIDR 10.0.2.65/32 sur le seul port du webhook.
#
# CONFLIT C1 (docs/PHASE-B.md §6) : la CCNP kube-ops `allow-egress-unisolated` (toEntities: all, tous
# namespaces hors auth/backstage/hindsight/databases) s'ajoute à ces règles (union Cilium) : tant
# qu'elle n'exclut pas `platform.smadja.dev/egress-isolated=true`, l'egress de ces namespaces reste
# ouvert. L'installation fonctionne ; la primitive « default-deny egress » est NON PROUVABLE.
