# Data plane -> control plane : cluster-agent -> cluster-gateway :8443 (WebSocket mTLS) ;
# Envoy du data plane -> kgateway :9977 (xDS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-allow-from-data-plane
  namespace: openchoreo-control-plane
  labels: {app.kubernetes.io/part-of: openchoreo-lab}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openchoreo-data-plane}}
      ports: [{port: 8443, protocol: TCP}, {port: 9977, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-allow-to-control-plane-and-cells
  namespace: openchoreo-data-plane
  labels: {app.kubernetes.io/part-of: openchoreo-lab}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openchoreo-control-plane}}
      ports: [{port: 8443, protocol: TCP}, {port: 9977, protocol: TCP}]
    # Envoy -> backends des cellules (label posé en constante par le CPT cell-restricted). L'ingress
    # côté cellule est ouvert par les NetworkPolicy par composant rendues par OpenChoreo.
    - to:
        - namespaceSelector: {matchLabels: {platform.smadja.dev/cell: restricted}}
---
# Opérateur CNPG -> instance manager de lab-pg :8000 (pendant de allow-intra-dns-operator de lab-pg).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-allow-to-lab-pg
  namespace: cnpg-system
  labels: {app.kubernetes.io/part-of: openchoreo-lab}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: lab-pg}}
      ports: [{port: 8000, protocol: TCP}]
---
# Argo CD repo-server -> GitHub (dépôt public, HTTPS, sans identifiant). toFQDNs exige la visibilité DNS
# (règle dns L7 vers kube-dns) pour apprendre les IP de github.com.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lab-allow-github
  namespace: lab-argocd
  labels: {app.kubernetes.io/part-of: openchoreo-lab}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: argocd-repo-server}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: ANY}]
          rules:
            dns: [{matchPattern: "*"}]
    - toFQDNs:
        - matchName: github.com
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
