# TLS du Gateway du data plane (étape 5, avant le chart DP qui référence le Secret dp-gateway-tls).
# CA du labo auto-signée, entièrement NAMESPACÉE (Issuer, pas de ClusterIssuer : rien de cluster-scoped
# en plus). À remplacer par l'origine Cloudflare (ou ACME) quand l'exposition sera décidée par Paul.
# Hôtes : *.lab.smadja.dev (APP-CONTRACT §2 : miniflux.lab.smadja.dev, thunder.lab.smadja.dev).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: lab-selfsigned-bootstrap
  namespace: openchoreo-data-plane
  labels: {app.kubernetes.io/part-of: openchoreo-lab}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-gateway-ca
  namespace: openchoreo-data-plane
  labels: {app.kubernetes.io/part-of: openchoreo-lab}
spec:
  isCA: true
  commonName: openchoreo-lab-gateway-ca
  secretName: lab-gateway-ca
  duration: 2160h
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: lab-selfsigned-bootstrap, kind: Issuer}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: lab-gateway-ca
  namespace: openchoreo-data-plane
  labels: {app.kubernetes.io/part-of: openchoreo-lab}
spec:
  ca: {secretName: lab-gateway-ca}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dp-gateway-tls
  namespace: openchoreo-data-plane
  labels: {app.kubernetes.io/part-of: openchoreo-lab}
spec:
  secretName: dp-gateway-tls
  duration: 720h
  dnsNames: ["*.lab.smadja.dev", "lab.smadja.dev"]
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  issuerRef: {name: lab-gateway-ca, kind: Issuer}
