# BOOTSTRAP PRIVILÉGIÉ (étape 11, tools/oke/install.sh ; jamais synchronisé par Argo, aucune Application
# ne pointe sur platform/install/argocd/ hors apps/). Séparation (revue PR #8, P1) :
#   - bootstrap privilégié : project-default-locked.yaml, project-lab.yaml (AppProject lab, lab-authz,
#     lab-root), root-application.yaml ; modifiés seulement par PR + geste opérateur (install.sh --step 11) ;
#   - GitOps applicatif : apps/ (Application enfants, projet lab ou lab-authz), synchronisé par lab-root.
# AppProject `lab` : projet des objets plateforme du labo. Restreint au dépôt public du labo, au
# cluster local, aux namespaces `default` (objets OpenChoreo) et `lab-pg`, et à une liste FERMÉE de
# kinds, NOMMÉS quand ils sont cluster-scoped (revue B2). PAS de kind Application (projet lab-root) ni de
# destination lab-argocd : une PR ne peut pas créer d'Application par lab-platform (revue PR #8, P1).
# Ce que ce projet n'autorise PAS (reste « bootstrap » piloté par tools/oke/install.sh) : CRD, RBAC
# (ClusterRole/Binding : platform/cluster-agent/*.yaml), webhooks, Namespace autre que `lab-pg`, VAP autres
# que celles du labo (les VAP baseline-* de kube-ops sont hors d'atteinte), AppProject, Application, charts
# Helm, objets dp-* (OpenChoreo), types OpenChoreo NAMESPACÉS (ComponentType, ProjectType, Trait,
# DataPlane... : contourneraient les CCT durcis, revue A1). L'authz OpenChoreo (AuthzRole,
# AuthzRoleBinding, ClusterAuthzRole*) est BLOQUÉE ici : seul le projet `lab-authz` (chemin dédié
# platform/authz/) peut en porter.
# Rappels Argo CD 3.5 : clusterResourceWhitelist vide = rien ; `name` accepte un motif glob ;
# namespaceResourceBlacklist s'applique après la whitelist.
# Contrôle CI de ces règles (le projet ne peut pas restreindre un CHEMIN source) : job `platform`,
# tools/oke/argo_guard.py, docs/CI-PLATFORM-CHECKS.md.
# Aucun identifiant : dépôt public lu en HTTPS anonyme.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lab
  namespace: lab-argocd
  labels: {app.kubernetes.io/part-of: openchoreo-lab}
spec:
  description: Essai OpenChoreo (jetable) - platform/ et, en Phase C, generated/namespaces/default
  sourceRepos:
    - https://github.com/platform-zephyr/openchoreo-lab
    - https://github.com/platform-zephyr/openchoreo-lab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: default
    - server: https://kubernetes.default.svc
      namespace: lab-pg
  clusterResourceWhitelist:
    # Types OpenChoreo du labo (platform/{component-types,traits,project-types,resource-types}, manifests/40).
    - {group: openchoreo.dev, kind: ClusterComponentType, name: service-restricted}
    - {group: openchoreo.dev, kind: ClusterProjectType, name: cell-restricted}
    - {group: openchoreo.dev, kind: ClusterResourceType, name: cnpg-lab-db}
    - {group: openchoreo.dev, kind: ClusterTrait, name: persistent-volume-claim}
    - {group: openchoreo.dev, kind: ClusterTrait, name: health-probes}
    # VAP du labo seulement (platform/policies) ; jamais baseline-* (kube-ops).
    - {group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicy, name: lab-cluster-agent-scope}
    - {group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicy, name: lab-cell-pod-hardening}
    - {group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicyBinding, name: lab-cluster-agent-scope}
    - {group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicyBinding, name: lab-cell-pod-hardening}
    # Un seul Namespace : lab-pg (platform/data/lab-pg-namespace.yaml).
    - {group: "", kind: Namespace, name: lab-pg}
  namespaceResourceWhitelist:
    # Kinds OpenChoreo APPLICATIFS seulement (manifests/40 et generated/, Phase C), listés un par un
    # (revue A1) : jamais ComponentType, ProjectType, Trait, ResourceType, DataPlane namespacés.
    - {group: openchoreo.dev, kind: Environment}
    - {group: openchoreo.dev, kind: DeploymentPipeline}
    - {group: openchoreo.dev, kind: Project}
    - {group: openchoreo.dev, kind: Component}
    - {group: openchoreo.dev, kind: ComponentRelease}
    - {group: openchoreo.dev, kind: Workload}
    - {group: openchoreo.dev, kind: ReleaseBinding}
    - {group: openchoreo.dev, kind: ProjectReleaseBinding}
    - {group: openchoreo.dev, kind: Resource}
    - {group: openchoreo.dev, kind: ResourceReleaseBinding}
    - {group: openchoreo.dev, kind: SecretReference}
    # NetworkPolicy : seulement celles de lab-pg, par nom (contrôle CI argo_guard, revue A1).
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: postgresql.cnpg.io, kind: Cluster}
  namespaceResourceBlacklist:
    # Droits MCP/API : seulement par le projet lab-authz (chemin dédié, revue B2).
    - {group: openchoreo.dev, kind: AuthzRole}
    - {group: openchoreo.dev, kind: AuthzRoleBinding}
  clusterResourceBlacklist:
    - {group: openchoreo.dev, kind: ClusterAuthzRole}
    - {group: openchoreo.dev, kind: ClusterAuthzRoleBinding}
    - {group: openchoreo.dev, kind: ClusterDataPlane}
  orphanedResources:
    warn: true
---
# AppProject `lab-authz` (étape 11) : SEUL projet autorisé à porter l'authz OpenChoreo, depuis le chemin
# dédié platform/authz/ (Application lab-authz, sync MANUELLE). Rôles et liaisons cluster-scoped nommés
# `lab-*` ; aucun objet namespacé ; aucune autre ressource. Toute PR qui touche platform/authz/ exige la
# revue du propriétaire (CODEOWNERS) ; la CI refuse un kind Authz* hors de ce chemin et tout autre
# Application utilisant ce projet (docs/CI-PLATFORM-CHECKS.md).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lab-authz
  namespace: lab-argocd
  labels: {app.kubernetes.io/part-of: openchoreo-lab}
spec:
  description: Authz OpenChoreo du labo (platform/authz) - roles et liaisons lab-*
  sourceRepos:
    - https://github.com/platform-zephyr/openchoreo-lab
    - https://github.com/platform-zephyr/openchoreo-lab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: lab-argocd
  clusterResourceWhitelist:
    - {group: openchoreo.dev, kind: ClusterAuthzRole, name: "lab-*"}
    - {group: openchoreo.dev, kind: ClusterAuthzRoleBinding, name: "lab-*"}
  namespaceResourceBlacklist:
    - {group: "*", kind: "*"}
  orphanedResources:
    warn: true
---
# AppProject `lab-root` (étape 11) : RÉSERVÉ à l'Application racine lab-root (root-application.yaml), qui
# synchronise platform/install/argocd/apps/. Un seul kind : Application, dans lab-argocd seulement. Aucun
# kind cluster-scoped, aucun AppProject. Les Application enfants déclarent elles-mêmes leur projet : la
# CI (argo_guard) n'admet que `lab` et `lab-authz` dans apps/, et le projet `default` est verrouillé
# (project-default-locked.yaml).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lab-root
  namespace: lab-argocd
  labels: {app.kubernetes.io/part-of: openchoreo-lab}
spec:
  description: Application racine du labo - Application enfants de platform/install/argocd/apps seulement
  sourceRepos:
    - https://github.com/platform-zephyr/openchoreo-lab
    - https://github.com/platform-zephyr/openchoreo-lab.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: lab-argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: argoproj.io, kind: Application}
  orphanedResources:
    warn: true
