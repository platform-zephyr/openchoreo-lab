# Application racine du labo (étape 11, app-of-apps). Elle ne synchronise que platform/install/argocd/apps
# (des Application). Pas de finalizer resources-finalizer : supprimer l'Application CONSERVE les objets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-root
  namespace: lab-argocd
  labels: {app.kubernetes.io/part-of: openchoreo-lab}
spec:
  project: lab
  source:
    repoURL: https://github.com/platform-zephyr/openchoreo-lab
    targetRevision: main
    path: platform/install/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
