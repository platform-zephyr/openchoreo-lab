# BOOTSTRAP PRIVILÉGIÉ (T-489 ; posé par l'opérateur avec les deux autres fichiers de ce dossier).
# lab-argocd est en lab-default-deny (manifests/02-network-policies.yaml). Le contrôleur Notifications SEUL sort vers
# api.github.com:443 (API Checks). Même forme que lab-allow-github (repo-server -> github.com) : toFQDNs exige la
# visibilité DNS L7 (règle dns vers kube-dns). Repo-server (:8081) et API Kubernetes : déjà ouverts par
# lab-allow-intra et lab-allow-apiserver.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lab-allow-github-api-notifications
  namespace: lab-argocd
  labels: {app.kubernetes.io/part-of: openchoreo-lab}
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: argocd-notifications-controller}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: ANY}]
          rules:
            dns: [{matchPattern: "*"}]
    - toFQDNs:
        - matchName: api.github.com
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
