# BOOTSTRAP PRIVILÉGIÉ (T-489 ; posé par l'opérateur avec argocd-notifications-cm.yaml, jamais synchronisé par Argo).
# Secret argocd-notifications-secret (lu par le contrôleur Notifications, nom par défaut du chart ; le chart ne le
# crée pas : notifications.secret.create=false dans platform/install/values/argocd.yaml) rendu par ESO depuis le
# coffre lab-secrets via le ClusterSecretStore `lab-store` (provider kubernetes, manifests/20-eso-lab-store.yaml,
# condition ^lab-argocd$). AUCUNE valeur ici : seulement des noms.
# Source dans le coffre : Secret `openchoreo-status` du namespace lab-secrets, trois clés, déposé par un geste
# explicite de l'opérateur depuis Doppler (projet identity, config openchoreo-status ; T-005, docs/AGENT-IDENTITY.md).
# Jamais l'App de l'usine `openchoreo-worker` : sa clé n'entre dans aucun cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: lab-argocd
  labels:
    app.kubernetes.io/part-of: openchoreo-lab
    app.kubernetes.io/component: notifications-controller
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: lab-store
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OPENCHOREO_STATUS_APP_ID
      remoteRef: {key: openchoreo-status, property: OPENCHOREO_STATUS_APP_ID}
    - secretKey: OPENCHOREO_STATUS_INSTALLATION_ID
      remoteRef: {key: openchoreo-status, property: OPENCHOREO_STATUS_INSTALLATION_ID}
    - secretKey: OPENCHOREO_STATUS_PRIVATE_KEY
      remoteRef: {key: openchoreo-status, property: OPENCHOREO_STATUS_PRIVATE_KEY}
