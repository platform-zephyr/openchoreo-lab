# Applications du labo, Git -> Argo : generated/namespaces/default (sortie de tools/appgen ; PR APPLICATIVES).
# Projet lab-apps : kinds OpenChoreo NAMESPACÉS applicatifs dans `default`, aucun kind cluster-scoped
# (flux A2, docs/ARGO-ESCALATION.md). Un manifest glissé dans generated/ (ClusterRoleBinding, Namespace,
# VAP, Secret, Application...) est refusé par Argo à la synchronisation.
# Phase C ouverte pour whoami seulement : sync AUTOMATIQUE sans prune, limitée au dossier de l'app (les autres apps
# de generated/ ciblent k3d et ne doivent pas atteindre OKE). Ajouter une app OKE = ajouter son dossier par PR.
# Prune désactivé : finalizers Component/Resource (APP-CONTRACT §5).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-apps
  namespace: lab-argocd
  labels: {app.kubernetes.io/part-of: openchoreo-lab}
spec:
  project: lab-apps
  source:
    repoURL: https://github.com/platform-zephyr/openchoreo-lab
    targetRevision: main
    path: generated/namespaces/default/projects/whoami
    directory:
      recurse: true
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
