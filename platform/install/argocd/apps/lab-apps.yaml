# Applications du labo OKE, Git -> Argo (T-491, T-502) : UNE Application `lab-o-<app>` par entrée de
# clusters/oke/lab-o-apps.yaml (liste versionnée du cluster OKE), créée par cet ApplicationSet sur
# generated/namespaces/default/projects/<app> (sortie de tools/appgen ; PR APPLICATIVES). Générateur Git `files`
# natif d'Argo CD : un fichier qui contient un tableau rend un jeu de paramètres par élément (`.app`).
# Projet `lab-o` LITTÉRAL (jamais tiré du dépôt applicatif), destination littérale `default` :
# kinds OpenChoreo NAMESPACÉS applicatifs, aucun kind cluster-scoped (flux A2, docs/ARGO-ESCALATION.md).
# Ajouter une app OKE = apps/<app>/app.yaml + sa sortie generated/ + une ligne dans la liste ; rien sous platform/.
# Une app k3d ou à volume/base n'est pas dans la liste : elle ne touche ni la liste ni ce fichier.
# tools/oke/argo_guard.py (O1-O5) refuse tout autre générateur ou fichier, tout projet ou toute destination
# paramétrés, et toute entrée de la liste qui n'est pas une app OKE stateless générée.
# goTemplate + missingkey=error : un paramètre absent fait échouer le rendu au lieu de produire une valeur vide.
# preserveResourcesOnDeletion : supprimer l'ApplicationSet ou une Application CONSERVE les objets applicatifs.
# Synchro AUTOMATIQUE sans prune (finalizers Component/Resource : APP-CONTRACT §5).
# Le contrôleur ApplicationSet est à 0 réplica dans platform/install/values/argocd.yaml jusqu'à T-487.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: lab-o
  namespace: lab-argocd
  labels: {app.kubernetes.io/part-of: openchoreo-lab}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: https://github.com/platform-zephyr/openchoreo-lab
        revision: main
        files:
          - path: clusters/oke/lab-o-apps.yaml
  template:
    metadata:
      name: "lab-o-{{.app}}"
      labels: {app.kubernetes.io/part-of: openchoreo-lab}
    spec:
      project: lab-o
      source:
        repoURL: https://github.com/platform-zephyr/openchoreo-lab
        targetRevision: main
        path: "generated/namespaces/default/projects/{{.app}}"
        directory:
          recurse: true
          include: "*.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated: {prune: false, selfHeal: true}
        syncOptions:
          - ServerSideApply=true
          - FailOnSharedResource=true
