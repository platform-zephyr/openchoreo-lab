# BROUILLON, JAMAIS APPLIQUÉ. Egress de openchoreo-api vers Authentik (JWKS), demandé par docs/PORTAL.md §3.
# L'API télécharge le JWKS (paresseux, puis toutes les heures et sur kid inconnu) ; elle n'appelle ni
# authorize ni token. Même forme que platform/portal/network-policies.yaml (lab-allow-backstage-authentik).
# CONFLIT C1 (docs/PHASE-B.md §6) : tant que la CCNP kube-ops allow-egress-unisolated s'applique,
# l'egress est ouvert de toute façon ; règle non prouvable avant C1.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lab-allow-openchoreo-api-authentik
  namespace: openchoreo-control-plane
  labels: {app.kubernetes.io/part-of: openchoreo-lab}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: api-server
      app.kubernetes.io/name: openchoreo-control-plane
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports: [{port: "53", protocol: ANY}]
          rules:
            dns: [{matchPattern: "*"}]
    - toFQDNs:
        - matchName: auth.smadja.dev
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
