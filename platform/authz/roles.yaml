# Administrateur plateforme (humain uniquement, jamais un agent).
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRole
metadata:
  name: lab-platform-admin
  labels:
    platform.smadja.dev/owner: lab-authz
spec:
  description: "Humain : administration complète de la plateforme"
  actions:
    - "*"
