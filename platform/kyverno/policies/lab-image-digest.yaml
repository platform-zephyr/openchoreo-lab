# K-03 `lab-image-digest` — images des contrôleurs épinglées par digest (@sha256:<64 hex>).
# Propriétaire sur les Pods de dp-* et lab-pg : VAP lab-cell-pod-hardening (Fail, sans webhook) — inchangée.
# Kyverno porte la même exigence sur une AUTRE cible (gabarits des contrôleurs) et un périmètre plus large
# (openchoreo-*, lab-*) que la VAP ne couvre pas : charts Helm/Argo du lab, composants OpenChoreo natifs.
# Pas de doublon avec la VAP kube-ops baseline-image-digest (Warn/Audit sur auth, backstage, hindsight : hors lab).
# failurePolicy Ignore : Kyverno arrêté, dp-*/lab-pg restent protégés par la VAP ; openchoreo-*/lab-* perdent
# ce contrôle (non critique : charts épinglés par sha256 et revus en PR, cf. REVIEW-PHASE-B « Images épinglées »).
# Tests : tests/kyverno/lab-image-digest/
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: lab-image-digest
  labels:
    app.kubernetes.io/part-of: openchoreo-lab
    platform.smadja.dev/policy-tier: shift-left
  annotations:
    platform.smadja.dev/ownership: "K-03 (docs/KYVERNO-POLICY-CONTRACT.md §1)"
    platform.smadja.dev/tests: tests/kyverno/lab-image-digest
    platform.smadja.dev/exceptionable: "true"
spec:
  validationActions: [Deny]
  failurePolicy: Ignore
  webhookConfiguration:
    timeoutSeconds: 5
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  matchConditions:
    - name: lab-perimeter
      expression: >-
        request.namespace.startsWith('dp-') || request.namespace.startsWith('lab-') ||
        request.namespace.startsWith('openchoreo-')
    - name: not-terminating
      expression: "!has(object.metadata.deletionTimestamp)"
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec
    - name: containers
      expression: >-
        variables.podSpec.containers +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c, c.image.matches('^[^@]+@sha256:[a-f0-9]{64}$'))
      messageExpression: >-
        'lab-image-digest: ' + object.kind + '/' + object.metadata.name + ' : image(s) sans digest @sha256 : ' +
        variables.containers.filter(c, !c.image.matches('^[^@]+@sha256:[a-f0-9]{64}$')).map(c, c.image).join(', ')
      reason: Forbidden
