# Genere par tools/appgen (ne pas editer a la main). Source : apps/*/app.yaml.
apiVersion: openchoreo.dev/v1alpha1
kind: SecretReference
metadata:
  name: rustical-pilot-secrets
  namespace: default
spec:
  template:
    type: Opaque
  data:
  - secretKey: RUSTICAL_OIDC__CLIENT_ID
    remoteRef:
      key: RUSTICAL_PILOT_OIDC_CLIENT_ID
  - secretKey: RUSTICAL_OIDC__CLIENT_SECRET
    remoteRef:
      key: RUSTICAL_PILOT_OIDC_CLIENT_SECRET
