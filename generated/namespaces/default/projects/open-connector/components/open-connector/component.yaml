# Genere par tools/appgen (ne pas editer a la main). Source : apps/*/app.yaml.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: open-connector
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  owner:
    projectName: open-connector
  componentType:
    kind: ClusterComponentType
    name: deployment/service-restricted
  autoDeploy: false
  parameters:
    runAsUser: 10001
    strategy: Recreate
    publicAuth: none
  traits:
  - kind: ClusterTrait
    name: persistent-volume-claim
    instanceName: data
    parameters:
      mountPath: /app/data
      dataClass: rebuildable
  - kind: ClusterTrait
    name: health-probes
    instanceName: probes
    parameters:
      containerName: main
      liveness:
        enabled: true
        handler: &id001
          httpGet:
            port: 3000
            path: /health
        initialDelaySeconds: 10
        periodSeconds: 10
      readiness:
        enabled: true
        handler: *id001
        periodSeconds: 5
