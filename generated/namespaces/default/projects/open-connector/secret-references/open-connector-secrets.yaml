# Genere par tools/appgen (ne pas editer a la main). Source : apps/*/app.yaml.
apiVersion: openchoreo.dev/v1alpha1
kind: SecretReference
metadata:
  name: open-connector-secrets
  namespace: default
spec:
  template:
    type: Opaque
  data:
  - secretKey: OOMOL_CONNECT_ADMIN_TOKEN
    remoteRef:
      key: OPEN_CONNECTOR_ADMIN_TOKEN
  - secretKey: OOMOL_CONNECT_ENCRYPTION_KEY
    remoteRef:
      key: OPEN_CONNECTOR_ENCRYPTION_KEY
