# Genere par tools/appgen (ne pas editer a la main). Source : apps/*/app.yaml.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: ntfy
  namespace: default
spec:
  owner:
    projectName: ntfy
  componentType:
    kind: ClusterComponentType
    name: deployment/service-restricted
  autoDeploy: false
  parameters:
    runAsUser: 65532
    strategy: Recreate
    publicAuth: app-password
  traits:
  - kind: ClusterTrait
    name: persistent-volume-claim
    instanceName: data
    parameters:
      mountPath: /var/lib/ntfy
