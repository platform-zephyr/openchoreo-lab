# Genere par tools/appgen (ne pas editer a la main). Source : apps/*/app.yaml.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: ntfy
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  owner:
    projectName: ntfy
  componentType:
    kind: ClusterComponentType
    name: deployment/service-restricted
  autoDeploy: false
  parameters:
    runAsUser: 65532
    strategy: RollingUpdate
    publicAuth: none
  traits:
  - kind: ClusterTrait
    name: health-probes
    instanceName: probes
    parameters:
      containerName: main
      liveness:
        enabled: true
        handler: &id001
          httpGet:
            port: 8080
            path: /v1/health
        initialDelaySeconds: 10
        periodSeconds: 10
      readiness:
        enabled: true
        handler: *id001
        periodSeconds: 5
