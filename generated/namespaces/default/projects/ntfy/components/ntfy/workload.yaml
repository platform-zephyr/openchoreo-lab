# Genere par tools/appgen (ne pas editer a la main). Source : apps/*/app.yaml.
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: ntfy-workload
  namespace: default
spec:
  owner:
    projectName: ntfy
    componentName: ntfy
  container:
    image: docker.io/binwiederhier/ntfy:v2.28.0@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
    env:
    - key: NTFY_LISTEN_HTTP
      value: :8080
    args:
    - serve
  endpoints:
    http:
      type: HTTP
      port: 8080
      visibility:
      - internal
