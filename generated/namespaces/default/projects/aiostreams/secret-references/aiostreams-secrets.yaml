# Genere par tools/appgen (ne pas editer a la main). Source : apps/*/app.yaml.
apiVersion: openchoreo.dev/v1alpha1
kind: SecretReference
metadata:
  name: aiostreams-secrets
  namespace: default
spec:
  template:
    type: Opaque
  data:
  - secretKey: SECRET_KEY
    remoteRef:
      key: AIOSTREAMS_SECRET_KEY
  - secretKey: CONFIG_ACCESS_KEY
    remoteRef:
      key: AIOSTREAMS_CONFIG_ACCESS_KEY
