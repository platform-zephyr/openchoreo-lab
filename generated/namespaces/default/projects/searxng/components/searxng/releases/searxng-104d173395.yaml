# Genere par tools/appgen (ne pas editer a la main). Source : apps/*/app.yaml.
apiVersion: openchoreo.dev/v1alpha1
kind: ComponentRelease
metadata:
  name: searxng-104d173395
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  owner:
    componentName: searxng
    projectName: searxng
  componentType:
    kind: ClusterComponentType
    name: deployment/service-restricted
    spec:
      workloadType: deployment
      allowedWorkflows: []
      allowedTraits:
      - kind: ClusterTrait
        name: persistent-volume-claim
      - kind: ClusterTrait
        name: health-probes
      parameters:
        openAPIV3Schema:
          type: object
          properties:
            runAsUser:
              type: integer
              minimum: 1000
              default: 65532
            strategy:
              type: string
              enum:
              - RollingUpdate
              - Recreate
              default: RollingUpdate
            readOnlyRootFilesystem:
              type: boolean
              default: true
            publicAuth:
              type: string
              enum:
              - none
              - app-oidc
              - app-password
              - cloudflare-access
              default: none
      environmentConfigs:
        openAPIV3Schema:
          type: object
          properties:
            replicas:
              type: integer
              minimum: 0
              maximum: 3
              default: 1
            size:
              type: string
              enum:
              - small
              - medium
              default: small
      preRenderValidations:
      - rule: ${size(workload.endpoints) > 0}
        message: au moins un endpoint (service-restricted)
      - rule: ${workload.container.image.matches('^[^@]+@sha256:[a-f0-9]{64}$')}
        message: image épinglée par digest obligatoire
      - rule: "${workload.endpoints.exists(name, ep, \"external\" in ep.visibility)\n  ? parameters.publicAuth != \"none\" : true}"
        message: exposition publique sans authentification interdite
      - rule: "${workload.endpoints.exists(name, ep, \"external\" in ep.visibility)\n  ? has(gateway.ingress) && has(gateway.ingress.external)\n  : true}"
        message: 'endpoint external : gateway.ingress.external requis sur l''Environment ou le DataPlane'
      - rule: "${workload.endpoints.exists(name, ep, \"internal\" in ep.visibility)\n  ? has(gateway.ingress) && has(gateway.ingress.internal)\n  : true}"
        message: 'endpoint internal : gateway.ingress.internal requis sur l''Environment ou le DataPlane'
      - rule: '${parameters.strategy == "Recreate" ? environmentConfigs.replicas <= 1 : true}'
        message: 'PVC RWO : replicas <= 1'
      resources:
      - id: deployment
        template:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${metadata.name}
            namespace: ${metadata.namespace}
            labels: ${metadata.labels}
          spec:
            replicas: ${environmentConfigs.replicas}
            strategy:
              type: ${parameters.strategy}
            selector:
              matchLabels: ${metadata.podSelectors}
            template:
              metadata:
                labels: ${metadata.podSelectors}
              spec:
                automountServiceAccountToken: false
                enableServiceLinks: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: ${parameters.runAsUser}
                  runAsGroup: ${parameters.runAsUser}
                  fsGroup: ${parameters.runAsUser}
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                - name: main
                  image: ${workload.container.image}
                  imagePullPolicy: IfNotPresent
                  command: '${has(workload.container.command) ? workload.container.command : oc_omit()}

                    '
                  args: '${has(workload.container.args) ? workload.container.args : oc_omit()}

                    '
                  securityContext:
                    allowPrivilegeEscalation: false
                    privileged: false
                    readOnlyRootFilesystem: ${parameters.readOnlyRootFilesystem}
                    capabilities:
                      drop:
                      - ALL
                  resources:
                    requests:
                      cpu: '${environmentConfigs.size == "medium" ? "200m" : "50m"}'
                      memory: '${environmentConfigs.size == "medium" ? "256Mi" : "128Mi"}'
                    limits:
                      cpu: '${environmentConfigs.size == "medium" ? "500m" : "250m"}'
                      memory: '${environmentConfigs.size == "medium" ? "512Mi" : "256Mi"}'
                  env: ${dependencies.toContainerEnvs()}
                  envFrom: ${configurations.toContainerEnvFrom()}
                  volumeMounts: '${configurations.toContainerVolumeMounts() + dependencies.toContainerVolumeMounts() + dyn([{"name": "tmp", "mountPath": "/tmp"}])}'
                volumes: '${configurations.toVolumes() + dependencies.toVolumes() + dyn([{"name": "tmp", "emptyDir": {"sizeLimit": "64Mi"}}])}'
      - id: service
        includeWhen: ${size(workload.endpoints) > 0}
        template:
          apiVersion: v1
          kind: Service
          metadata:
            name: ${metadata.componentName}
            namespace: ${metadata.namespace}
            labels: ${metadata.labels}
          spec:
            type: ClusterIP
            selector: ${metadata.podSelectors}
            ports: ${workload.toServicePorts()}
      - id: httproute-external
        forEach: ${workload.endpoints.transformMap(name, ep, "external" in ep.visibility && ep.type in ["HTTP", "GraphQL", "Websocket"], ep)}
        var: endpoint
        template:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: ${oc_generate_name(metadata.componentName, endpoint.key)}
            namespace: ${metadata.namespace}
            labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-name": endpoint.key, "openchoreo.dev/endpoint-visibility": "external"})}'
          spec:
            parentRefs:
            - name: ${gateway.ingress.external.name}
              namespace: ${gateway.ingress.external.namespace}
            hostnames: "${[gateway.ingress.external.?http, gateway.ingress.external.?https]\n  .filter(g, g.hasValue()).map(g, g.value().host).distinct()\n  .map(h, metadata.environmentName + \"-\" + metadata.componentNamespace + \".\" + h)}\n"
            rules:
            - matches:
              - path:
                  type: PathPrefix
                  value: /${metadata.componentName}-${endpoint.key}
              filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: ${endpoint.value.?basePath.orValue("/")}
              backendRefs:
              - name: ${metadata.componentName}
                port: ${endpoint.value.port}
      - id: httproute-internal
        forEach: ${workload.endpoints.transformMap(name, ep, "internal" in ep.visibility && ep.type in ["HTTP", "GraphQL", "Websocket"], ep)}
        var: endpoint
        template:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: ${oc_generate_name(metadata.componentName, endpoint.key, "internal")}
            namespace: ${metadata.namespace}
            labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-name": endpoint.key, "openchoreo.dev/endpoint-visibility": "internal"})}'
          spec:
            parentRefs:
            - name: ${gateway.ingress.internal.name}
              namespace: ${gateway.ingress.internal.namespace}
            hostnames: "${[gateway.ingress.internal.?http, gateway.ingress.internal.?https]\n  .filter(g, g.hasValue()).map(g, g.value().host).distinct()\n  .map(h, metadata.environmentName + \"-\" + metadata.componentNamespace + \".\" + h)}\n"
            rules:
            - matches:
              - path:
                  type: PathPrefix
                  value: /${metadata.componentName}-${endpoint.key}
              filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: ${endpoint.value.?basePath.orValue("/")}
              backendRefs:
              - name: ${metadata.componentName}
                port: ${endpoint.value.port}
      - id: env-config
        forEach: ${configurations.toConfigEnvsByContainer()}
        var: envConfig
        template:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ${envConfig.resourceName}
            namespace: ${metadata.namespace}
          data: '${envConfig.envs.transformMapEntry(index, env, {env.name: env.value})}

            '
      - id: file-config
        forEach: ${configurations.toConfigFileList()}
        var: config
        template:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ${config.resourceName}
            namespace: ${metadata.namespace}
          data:
            ${config.name}: '${config.value}

              '
      - id: secret-env-external
        forEach: ${configurations.toSecretEnvsByContainer()}
        var: secretEnv
        template:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: ${secretEnv.resourceName}
            namespace: ${metadata.namespace}
          spec:
            refreshInterval: 15s
            secretStoreRef:
              name: ${dataplane.secretStore}
              kind: ClusterSecretStore
            target:
              name: ${secretEnv.resourceName}
              creationPolicy: Owner
            data: "${secretEnv.envs.map(secret, {\n  \"secretKey\": secret.name,\n  \"remoteRef\": {\n    \"key\": secret.remoteRef.key,\n    ?\"property\": secret.remoteRef.?property\n  }\n})}\n"
      - id: secret-file-external
        forEach: ${configurations.toSecretFileList()}
        var: file
        template:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: ${file.resourceName}
            namespace: ${metadata.namespace}
          spec:
            refreshInterval: 15s
            secretStoreRef:
              name: ${dataplane.secretStore}
              kind: ClusterSecretStore
            target:
              name: ${file.resourceName}
              creationPolicy: Owner
            data:
            - secretKey: ${file.name}
              remoteRef:
                key: ${file.remoteRef.key}
                property: '${has(file.remoteRef.property) ? file.remoteRef.property : oc_omit()}

                  '
      postRenderValidations:
      - target:
          group: apps
          version: v1
          kind: Deployment
        rule: "${has(resource.spec.template.spec.securityContext) &&\n  has(resource.spec.template.spec.securityContext.runAsNonRoot) &&\n  resource.spec.template.spec.securityContext.runAsNonRoot == true &&\n  has(resource.spec.template.spec.securityContext.runAsUser) &&\n  resource.spec.template.spec.securityContext.runAsUser >= 1000 &&\n  has(resource.spec.template.spec.securityContext.seccompProfile) &&\n  resource.spec.template.spec.securityContext.seccompProfile.type == \"RuntimeDefault\" &&\n  has(resource.spec.template.spec.automountServiceAccountToken) &&\n  resource.spec.template.spec.automountServiceAccountToken == false}"
        message: 'securityContext restricted altéré (pod : runAsNonRoot, runAsUser>=1000, seccomp, automount)'
      - target:
          group: apps
          version: v1
          kind: Deployment
        rule: "${resource.spec.template.spec.containers.all(c,\n    has(c.securityContext) &&\n    has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false &&\n    (!has(c.securityContext.privileged) || c.securityContext.privileged == false) &&\n    (!has(c.securityContext.runAsUser) || c.securityContext.runAsUser >= 1000) &&\n    has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) &&\n    \"ALL\" in c.securityContext.capabilities.drop &&\n    (!has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0) &&\n    (parameters.readOnlyRootFilesystem\n      ? (has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem == true)\n      : true))}"
        message: 'securityContext restricted altéré (conteneur : privilege escalation, privileged, capabilities, rootfs)'
      - target:
          group: apps
          version: v1
          kind: Deployment
        rule: "${!has(resource.spec.template.spec.initContainers) &&\n  !has(resource.spec.template.spec.ephemeralContainers) &&\n  size(resource.spec.template.spec.containers) == 1 &&\n  resource.spec.template.spec.containers.all(c, c.image.matches('^[^@]+@sha256:[a-f0-9]{64}$'))}"
        message: un seul conteneur, sans init ni sidecar, image épinglée par digest
      - target:
          group: apps
          version: v1
          kind: Deployment
        rule: "${!(has(resource.spec.template.spec.hostNetwork) && resource.spec.template.spec.hostNetwork) &&\n  !(has(resource.spec.template.spec.hostPID) && resource.spec.template.spec.hostPID) &&\n  !(has(resource.spec.template.spec.hostIPC) && resource.spec.template.spec.hostIPC) &&\n  (!has(resource.spec.template.spec.volumes) ||\n    resource.spec.template.spec.volumes.all(v, !has(v.hostPath)))}"
        message: hostNetwork, hostPID, hostIPC et hostPath interdits
      - target:
          group: apps
          version: v1
          kind: Deployment
        rule: "${has(resource.spec.template.spec.volumes) &&\n  resource.spec.template.spec.volumes.exists(v, has(v.persistentVolumeClaim))\n  ? (has(resource.spec.strategy) && resource.spec.strategy.type == \"Recreate\" &&\n     (!has(resource.spec.replicas) || resource.spec.replicas <= 1))\n  : true}"
        message: 'PVC RWO : strategy Recreate et replicas <= 1 obligatoires'
      - target:
          group: ''
          version: v1
          kind: Service
          mustMatch: false
        rule: ${!has(resource.spec.type) || resource.spec.type == "ClusterIP"}
        message: Service ClusterIP seulement (ni LoadBalancer ni NodePort)
      - target:
          group: ''
          version: v1
          kind: Namespace
          mustMatch: false
        rule: ${false}
        message: 'kind interdit : Namespace'
      - target:
          group: ''
          version: v1
          kind: PersistentVolume
          mustMatch: false
        rule: ${false}
        message: 'kind interdit : PersistentVolume'
      - target:
          group: ''
          version: v1
          kind: ServiceAccount
          mustMatch: false
        rule: ${false}
        message: 'kind interdit : ServiceAccount'
      - target:
          group: rbac.authorization.k8s.io
          version: v1
          kind: ClusterRole
          mustMatch: false
        rule: ${false}
        message: 'kind interdit : ClusterRole'
      - target:
          group: rbac.authorization.k8s.io
          version: v1
          kind: ClusterRoleBinding
          mustMatch: false
        rule: ${false}
        message: 'kind interdit : ClusterRoleBinding'
      - target:
          group: rbac.authorization.k8s.io
          version: v1
          kind: Role
          mustMatch: false
        rule: ${false}
        message: 'kind interdit : Role'
      - target:
          group: rbac.authorization.k8s.io
          version: v1
          kind: RoleBinding
          mustMatch: false
        rule: ${false}
        message: 'kind interdit : RoleBinding'
      - target:
          group: networking.k8s.io
          version: v1
          kind: NetworkPolicy
          mustMatch: false
        rule: ${false}
        message: 'kind interdit : NetworkPolicy (réservée au CPT et au contrôleur)'
      - target:
          group: storage.k8s.io
          version: v1
          kind: StorageClass
          mustMatch: false
        rule: ${false}
        message: 'kind interdit : StorageClass'
      - target:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingWebhookConfiguration
          mustMatch: false
        rule: ${false}
        message: 'kind interdit : ValidatingWebhookConfiguration'
      - target:
          group: admissionregistration.k8s.io
          version: v1
          kind: MutatingWebhookConfiguration
          mustMatch: false
        rule: ${false}
        message: 'kind interdit : MutatingWebhookConfiguration'
      - target:
          group: admissionregistration.k8s.io
          version: v1
          kind: ValidatingAdmissionPolicy
          mustMatch: false
        rule: ${false}
        message: 'kind interdit : ValidatingAdmissionPolicy'
      - target:
          group: apiextensions.k8s.io
          version: v1
          kind: CustomResourceDefinition
          mustMatch: false
        rule: ${false}
        message: 'kind interdit : CustomResourceDefinition'
      - target:
          group: scheduling.k8s.io
          version: v1
          kind: PriorityClass
          mustMatch: false
        rule: ${false}
        message: 'kind interdit : PriorityClass'
      - target:
          group: external-secrets.io
          version: v1
          kind: ClusterSecretStore
          mustMatch: false
        rule: ${false}
        message: 'kind interdit : ClusterSecretStore'
      - target:
          group: external-secrets.io
          version: v1
          kind: SecretStore
          mustMatch: false
        rule: ${false}
        message: 'kind interdit : SecretStore'
      - target:
          group: cilium.io
          version: v2
          kind: CiliumClusterwideNetworkPolicy
          mustMatch: false
        rule: ${false}
        message: 'kind interdit : CiliumClusterwideNetworkPolicy'
      - target:
          group: apps
          version: v1
          kind: DaemonSet
          mustMatch: false
        rule: ${false}
        message: 'kind interdit : DaemonSet'
  workload:
    container:
      image: docker.io/searxng/searxng:2026.9.30-a9d990033@sha256:a07a5cd2da2c63d66e559f9e4d3a3db106cfc6c32fb0ac70abe91cc28bcd7350
      env:
      - key: SEARXNG_SETTINGS_PATH
        value: /usr/local/searxng/settings.template.yml
      - key: SEARXNG_SECRET
        valueFrom:
          secretKeyRef:
            name: searxng-secrets
            key: SEARXNG_SECRET
      command:
      - /usr/local/searxng/.venv/bin/granian
      args:
      - searx.webapp:app
    endpoints:
      http:
        type: HTTP
        port: 8080
        visibility:
        - internal
  componentProfile:
    parameters:
      runAsUser: 65532
      strategy: RollingUpdate
      publicAuth: none
    traits:
    - kind: ClusterTrait
      name: health-probes
      instanceName: probes
      parameters:
        containerName: main
        liveness:
          enabled: true
          handler: &id001
            httpGet:
              port: 8080
              path: /healthz
          initialDelaySeconds: 10
          periodSeconds: 10
        readiness:
          enabled: true
          handler: *id001
          periodSeconds: 5
  traits:
  - kind: ClusterTrait
    name: health-probes
    spec:
      parameters:
        openAPIV3Schema:
          type: object
          $defs:
            Handler:
              title: Handler
              description: Select the type of probe to use and configure its parameters
              x-openchoreo-backstage-portal:
                ui:options:
                  hideError: true
              oneOf:
              - title: None
                type: object
                maxProperties: 0
              - title: HTTP GET
                required:
                - httpGet
                properties:
                  httpGet:
                    type: object
                    title: ''
                    properties:
                      port:
                        type: integer
                        minimum: 1
                        maximum: 65535
                        title: Port
                      path:
                        type: string
                        default: /
                        title: Path
              - title: TCP socket
                required:
                - tcpSocket
                properties:
                  tcpSocket:
                    type: object
                    title: ''
                    properties:
                      port:
                        type: integer
                        minimum: 1
                        maximum: 65535
                        title: Port
              - title: gRPC
                required:
                - grpc
                properties:
                  grpc:
                    type: object
                    title: ''
                    properties:
                      port:
                        type: integer
                        minimum: 1
                        maximum: 65535
                        title: Port
                      service:
                        type: string
                        title: Service
                        description: Optional name of the service to check. When unset, the overall gRPC health is used.
              - title: Exec
                required:
                - exec
                properties:
                  exec:
                    type: object
                    title: ''
                    properties:
                      command:
                        type: array
                        title: Command
                        description: Command to run inside the container. A zero exit code means healthy.
                        items:
                          type: string
          x-openchoreo-backstage-portal:
            ui:order:
            - containerName
            - liveness
            - readiness
            - startup
          properties:
            containerName:
              type: string
              default: main
              title: Container name
              description: Name of the container the probes are attached to. Defaults to 'main'.
            liveness:
              type: object
              default: {}
              title: Liveness probe
              description: Restarts the container when it stops being healthy.
              x-openchoreo-backstage-portal:
                ui:order:
                - enabled
                - handler
                - initialDelaySeconds
                - periodSeconds
                - timeoutSeconds
                - failureThreshold
              properties:
                enabled:
                  type: boolean
                  default: false
                  title: Enabled
                  x-openchoreo-backstage-portal:
                    ui:widget: checkbox
                handler:
                  $ref: '#/$defs/Handler'
                initialDelaySeconds:
                  type: integer
                  default: 0
                  minimum: 0
                  title: Initial delay seconds
                  description: Seconds to wait after the container starts before the first probe.
                periodSeconds:
                  type: integer
                  default: 10
                  minimum: 1
                  title: Period seconds
                timeoutSeconds:
                  type: integer
                  default: 1
                  minimum: 1
                  title: Timeout seconds
                failureThreshold:
                  type: integer
                  default: 3
                  minimum: 1
                  title: Failure threshold
            readiness:
              type: object
              default: {}
              title: Readiness probe
              description: Removes the pod from service endpoints while it is not ready to receive traffic.
              x-openchoreo-backstage-portal:
                ui:order:
                - enabled
                - handler
                - initialDelaySeconds
                - periodSeconds
                - timeoutSeconds
                - failureThreshold
                - successThreshold
              properties:
                enabled:
                  type: boolean
                  default: false
                  title: Enabled
                  x-openchoreo-backstage-portal:
                    ui:widget: checkbox
                handler:
                  $ref: '#/$defs/Handler'
                initialDelaySeconds:
                  type: integer
                  default: 0
                  minimum: 0
                  title: Initial delay seconds
                  description: Seconds to wait after the container starts before the first probe.
                periodSeconds:
                  type: integer
                  default: 10
                  minimum: 1
                  title: Period seconds
                timeoutSeconds:
                  type: integer
                  default: 1
                  minimum: 1
                  title: Timeout seconds
                failureThreshold:
                  type: integer
                  default: 3
                  minimum: 1
                  title: Failure threshold
                successThreshold:
                  type: integer
                  default: 1
                  minimum: 1
                  title: Success threshold
                  description: Consecutive successes before the pod is considered ready.
            startup:
              type: object
              default: {}
              title: Startup probe
              description: Holds off the liveness and readiness probes until the container has finished starting.
              x-openchoreo-backstage-portal:
                ui:order:
                - enabled
                - handler
                - initialDelaySeconds
                - periodSeconds
                - timeoutSeconds
                - failureThreshold
              properties:
                enabled:
                  type: boolean
                  default: false
                  title: Enabled
                  x-openchoreo-backstage-portal:
                    ui:widget: checkbox
                handler:
                  $ref: '#/$defs/Handler'
                initialDelaySeconds:
                  type: integer
                  default: 0
                  minimum: 0
                  title: Initial delay seconds
                  description: Seconds to wait after the container starts before the first probe.
                periodSeconds:
                  type: integer
                  default: 10
                  minimum: 1
                  title: Period seconds
                timeoutSeconds:
                  type: integer
                  default: 1
                  minimum: 1
                  title: Timeout seconds
                failureThreshold:
                  type: integer
                  default: 30
                  minimum: 1
                  title: Failure threshold
      environmentConfigs:
        openAPIV3Schema:
          type: object
          properties:
            enabled:
              type: boolean
              default: true
              description: Master switch for this environment. When disabled, none of the probes are configured here.
              x-openchoreo-backstage-portal:
                ui:widget: checkbox
      validations:
      - rule: ${!parameters.liveness.enabled || (has(parameters.liveness.handler) && size([has(parameters.liveness.handler.httpGet), has(parameters.liveness.handler.tcpSocket), has(parameters.liveness.handler.grpc), has(parameters.liveness.handler.exec)].filter(x, x)) == 1 && (!has(parameters.liveness.handler.httpGet) || (has(parameters.liveness.handler.httpGet.port) && parameters.liveness.handler.httpGet.port >= 1 && parameters.liveness.handler.httpGet.port <= 65535)) && (!has(parameters.liveness.handler.tcpSocket) || (has(parameters.liveness.handler.tcpSocket.port) && parameters.liveness.handler.tcpSocket.port >= 1 && parameters.liveness.handler.tcpSocket.port <= 65535)) && (!has(parameters.liveness.handler.grpc) || (has(parameters.liveness.handler.grpc.port) && parameters.liveness.handler.grpc.port >= 1 && parameters.liveness.handler.grpc.port <= 65535)) && (!has(parameters.liveness.handler.exec) || size(parameters.liveness.handler.exec.command) > 0))}
