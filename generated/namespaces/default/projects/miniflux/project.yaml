apiVersion: openchoreo.dev/v1alpha1
kind: Project
metadata:
  name: miniflux
  namespace: default
  annotations:
    openchoreo.dev/description: Lecteur RSS
  labels:
    openchoreo.dev/name: miniflux
spec:
  deploymentPipelineRef:
    name: standard
  type:
    kind: ClusterProjectType
    name: cell-restricted
  parameters:
    egress: public-internet
    database: true
    allowIdp: true
    dataClass: rebuildable
