# toolchain.lock : liste d'outils partagée (ADR-0022, T-332). Format KEY=VALUE, une ligne par clé, sans guillemets.
# Binaires linux-arm64 (même cible que .devcontainer/Dockerfile et les runners ubuntu-24.04-arm) ; les empreintes
# sont celles de ci.yaml quand l'outil y figure. Source unique : toute montée modifie CETTE ligne, le Dockerfile ET
# ci.yaml dans la même PR ; tests/dev-factory/lock-concordance.sh (étape toolchain-lock de tools/dev/check) refuse
# tout désaccord. Aucun secret.
# Clés *_AMD64_SHA256 (SL-2, T-454) : empreintes linux-amd64 de la VM cloud x86_64, pour tools/dev/cloud-setup.sh ; elles
# partagent la version <OUTIL>_VERSION (ni Dockerfile ni ci.yaml ne les portent). Source : fichier de checksums publié par
# le projet (helm : get.helm.sh .sha256sum ; kubeconform : CHECKSUMS ; yq : checksums, colonne SHA-256 ; gitleaks :
# *_checksums.txt, archive linux_x64 ; kubectl : dl.k8s.io/release/<v>/bin/linux/amd64/kubectl.sha256 ; jq : sha256sum.txt de la release, jq-linux-amd64 ; gh : gh_<v>_checksums.txt, archive linux_amd64.tar.gz ; actionlint : *_checksums.txt ; ruff : .tar.gz.sha256). Le projet shellcheck ne publie
# aucun checksum : l'empreinte amd64 est calculée sur l'archive officielle (deux téléchargements identiques ; l'empreinte
# arm64 déjà au lock a été recoupée de la même façon le 2026-11-18). pre-commit : zipapp .pyz de la release (aucun
# checksum publié non plus ; même méthode). Une montée de version recalcule ces empreintes à la source, jamais de mémoire.
