# Extrait minimal du rendu du chart kgateway v2.3.11 (ClusterRole, ClusterRoleBinding), valeurs factices.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kgateway-openchoreo-control-plane
rules:
- apiGroups: [""]
  resources: [configmaps, services]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [secrets, serviceaccounts]
  verbs: [create, delete, get, list, patch, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kgateway-role-openchoreo-control-plane
subjects:
- kind: ServiceAccount
  name: kgateway
  namespace: openchoreo-control-plane
roleRef:
  kind: ClusterRole
  name: kgateway-openchoreo-control-plane
  apiGroup: rbac.authorization.k8s.io
