apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata: {name: lab-protect-persistent-data-as-namespace-controller}
policies: [../../../../platform/kyverno/policies/lab-protect-persistent-data.yaml]
resources: [../objects.yaml]
clusterResources: [../cluster-resources.yaml]
userinfo: user.yaml
results:
