apiVersion: cli.kyverno.io/v1alpha1
kind: ClusterResource
metadata: {name: netpols}
spec:
  resources:
    - {apiVersion: v1, kind: Namespace, metadata: {name: lab-open}}
    - {apiVersion: v1, kind: Namespace, metadata: {name: lab-partial}}
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: default-deny, namespace: dp-cell-ok}
      spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: ingress-only, namespace: lab-open}
      spec: {podSelector: {}, policyTypes: [Ingress]}
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: some-pods, namespace: lab-partial}
      spec: {podSelector: {matchLabels: {app: other}}, policyTypes: [Egress]}
