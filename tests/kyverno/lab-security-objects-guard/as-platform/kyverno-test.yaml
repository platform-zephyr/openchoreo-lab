apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata: {name: lab-security-objects-guard-as-platform}
policies: [../../../../platform/kyverno/policies/lab-security-objects-guard.yaml]
resources: [../namespaces.yaml, ../guarded.yaml]
userinfo: user.yaml
results:
  # Même admin : un namespace privileged reste refusé (règle a, pas de contournement par identité).
  - {policy: lab-security-objects-guard, isValidatingPolicy: true, kind: Namespace, result: fail, resources: [lab-bad-privileged]}
  - {policy: lab-security-objects-guard, isValidatingPolicy: true, kind: NetworkPolicy, operation: DELETE, result: pass,
     resources: [lab-default-deny, default-deny]}
  - {policy: lab-security-objects-guard, isValidatingPolicy: true, kind: ResourceQuota, operation: UPDATE, result: pass, resources: [cell-quota]}
