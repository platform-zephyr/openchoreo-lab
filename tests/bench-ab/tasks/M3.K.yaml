prompt: >-
  Pour l'application ntfy (mode stateless) : change la valeur de la variable `NTFY_BASE_URL`, valide-la hors production, passe-la en production, puis annule le changement en production. Elle est terminée quand la valeur a été vue hors production puis en production, que la production est restée inchangée entre les deux, que l'état d'origine est restauré et qu'aucune autre application n'a été touchée. Passe uniquement par des pull requests.
