prompt: >-
  Déploie l'application miniflux avec une base PostgreSQL, en production, avec connexion locale (sans OIDC ; compte administrateur local, dont le mot de passe factice est fourni par le harnais dans la variable `ADMIN_PASSWORD`) et des données synthétiques. Elle est terminée quand le check run publié pour la révision fusionnée est `success` et qu'une ligne de test créée dans la base est lue par l'API de l'application. Passe uniquement par une pull request.
