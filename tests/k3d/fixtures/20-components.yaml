# Profil stateful : PVC RWO via le trait upstream persistent-volume-claim + strategy Recreate.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata: {name: t-pvc-b, namespace: default}
spec:
  owner: {projectName: t-cell-b}
  componentType: {kind: ClusterComponentType, name: deployment/service-restricted}
  autoDeploy: true
  parameters: {strategy: Recreate}
  traits:
    - kind: ClusterTrait
      name: persistent-volume-claim
      instanceName: data
      parameters: {mountPath: /data}
---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata: {name: t-pvc-b, namespace: default}
spec:
  owner: {projectName: t-cell-b, componentName: t-pvc-b}
  endpoints:
    http: {type: HTTP, port: 8080}
  container:
    image: traefik/whoami:v1.10.3@sha256:43a68d10b9dfcfc3ffbfe4dd42100dc9aeaf29b3a5636c856337a5940f1b4f1c
    args: ["--port", "8080"]
