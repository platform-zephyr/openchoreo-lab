  owner: {projectName: t-cell-a, componentName: t-neg-caps}
  endpoints: {http: {type: HTTP, port: 8080}}
  container:
    image: traefik/whoami:v1.10.3@sha256:43a68d10b9dfcfc3ffbfe4dd42100dc9aeaf29b3a5636c856337a5940f1b4f1c
    args: ["--port", "8080"]
