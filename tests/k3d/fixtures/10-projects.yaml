# Deux cellules de test (k3d) sur le CPT cell-restricted.
#   t-cell-a : egress none, database true  (whoami + client PG + 2 bases)
#   t-cell-b : egress public-internet, database false, 1 PVC (whoami + sonde réseau + app PVC)
# Pipeline de test : la CI (tools/k3d/ci-bootstrap.sh) n'installe que `standard` (promotionPaths vide) et pas
# `default`. Avec autoDeploy: true, le contrôleur n'a alors aucun pipeline (`DeploymentPipeline "default" not
# found`) et ne crée aucun ReleaseBinding (T-469). Modèle : tests/mcp/fixtures/lab-mcp-target.yaml.
apiVersion: openchoreo.dev/v1alpha1
kind: DeploymentPipeline
metadata:
  name: t-pipeline
  namespace: default
spec:
  promotionPaths:
    - sourceEnvironmentRef: {kind: Environment, name: development}
      targetEnvironmentRefs:
        - {kind: Environment, name: production}
---
apiVersion: openchoreo.dev/v1alpha1
kind: Project
metadata:
  name: t-cell-a
  namespace: default
spec:
  deploymentPipelineRef: {kind: DeploymentPipeline, name: t-pipeline}
  type: {kind: ClusterProjectType, name: cell-restricted}
  parameters: {egress: none, database: true}
---
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  name: t-cell-a-development
  namespace: default
spec:
  owner: {projectName: t-cell-a}
  environment: development
  # Tentative d'écrasement du label PSA : la constante du CPT doit gagner (test T01c).
  environmentConfigs:
    namespaceLabels:
      pod-security.kubernetes.io/enforce: privileged
---
apiVersion: openchoreo.dev/v1alpha1
kind: Project
metadata:
  name: t-cell-b
  namespace: default
spec:
  deploymentPipelineRef: {kind: DeploymentPipeline, name: t-pipeline}
  type: {kind: ClusterProjectType, name: cell-restricted}
  parameters: {egress: public-internet, database: false, quota: {pvcs: "1"}}
---
apiVersion: openchoreo.dev/v1alpha1
kind: ProjectReleaseBinding
metadata:
  name: t-cell-b-development
  namespace: default
spec:
  owner: {projectName: t-cell-b}
  environment: development
