# PROPOSITION (fixture de test) : extension du ClusterProjectType cell-restricted pour E1, E3 et E12.
# A FUSIONNER par l'agent platform/ dans platform/project-types/cell-restricted.yaml (non applique ici).
# Seuls les AJOUTS par rapport au CPT reel sont montres ; le reste (Namespace PSA, default-deny, DNS,
# egress-pg, egress-idp, egress-public, quota, limits) est inchange, sauf :
#   - label PSA enforce : parameters.podSecurity (restricted par defaut, baseline sur exception E12 nominative) ;
#   - egress-pg : namespace et cluster CNPG parametres (databaseNamespace, databaseCluster ; defaut lab-pg).
# Les except[] des CIDR sont calcules par tools/appgen (prives, CGNAT, link-local/IMDS) ; la CEL ci-dessous
# les re-verifie (defense en profondeur). Non evalue hors cluster : a prouver par dry-run serveur k3d [S].
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterProjectType
metadata:
  name: cell-restricted
spec:
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        egress: {type: string, enum: [none, public-internet], default: none}
        database: {type: boolean, default: false}
        allowIdp: {type: boolean, default: false}
        databaseNamespace: {type: string, default: lab-pg}
        databaseCluster: {type: string, default: lab-pg}
        podSecurity: {type: string, enum: [restricted, baseline], default: restricted}
        dataClass: {type: string, enum: ["", ephemeral, rebuildable, useful, irreplaceable], default: ""}
        egressCIDRs:
          type: array
          default: []
          maxItems: 64
          items:
            type: object
            required: [cidr, except, ports]
            properties:
              cidr: {type: string, pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}/([89]|[12][0-9]|3[0-2])$'}
              except: {type: array, items: {type: string}}
              ports: {type: array, minItems: 1, items: {type: integer, minimum: 1, maximum: 65535}}
        egressFQDNs:
          type: array
          default: []
          maxItems: 64
          items:
            type: object
            required: [ports]
            properties:
              matchName: {type: string}
              matchPattern: {type: string, pattern: '^\*\.[a-z0-9-]+\.[a-z0-9.-]+$'}
              ports: {type: array, minItems: 1, items: {type: integer, minimum: 1, maximum: 65535}}
        egressApps:
          type: array
          default: []
          items:
            type: object
            required: [project, component, port]
            properties:
              project: {type: string}
              component: {type: string}
              port: {type: integer, minimum: 1, maximum: 65535}
        quota:
          type: object
          default: {}
          properties:
            cpu: {type: string, default: "300m"}
            memory: {type: string, default: "512Mi"}
            pvcs: {type: string, default: "0"}
  validations:
    - rule: '${parameters.egressCIDRs.all(r, !r.cidr.startsWith("169.254.") && r.cidr != "0.0.0.0/0")}'
      message: "egress CIDR link-local/IMDS ou 0.0.0.0/0 interdit"
    - rule: '${parameters.egressCIDRs.all(r, int(r.cidr.split("/")[1]) >= 8)}'
      message: "egress CIDR plus large que /8 interdit (profil public-internet)"
  resources:
    - id: egress-allowlist
      includeWhen: ${size(parameters.egressCIDRs) > 0 || size(parameters.egressApps) > 0}
      template:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: egress-allowlist
          namespace: ${metadata.namespace}
        spec:
          podSelector: {}
          policyTypes: [Egress]
          egress: >-
            ${parameters.egressCIDRs.map(r, {"to": [{"ipBlock": size(r.except) > 0 ? {"cidr": r.cidr, "except": r.except} : {"cidr": r.cidr}}],
                "ports": r.ports.map(p, {"protocol": "TCP", "port": p})})
              + parameters.egressApps.map(a, {"to": [{"namespaceSelector": {"matchLabels": {
                    "openchoreo.dev/project": a.project,
                    "openchoreo.dev/environment": metadata.labels["openchoreo.dev/environment"]}},
                  "podSelector": {"matchLabels": {"openchoreo.dev/component": a.component}}}],
                "ports": [{"protocol": "TCP", "port": a.port}]})}
    - id: egress-fqdn
      includeWhen: ${size(parameters.egressFQDNs) > 0}
      template:
        apiVersion: cilium.io/v2
        kind: CiliumNetworkPolicy
        metadata:
          name: egress-fqdn
          namespace: ${metadata.namespace}
        spec:
          endpointSelector: {}
          egress: >-
            ${[{"toEndpoints": [{"matchLabels": {"k8s:io.kubernetes.pod.namespace": "kube-system", "k8s:k8s-app": "kube-dns"}}],
                "toPorts": [{"ports": [{"port": "53", "protocol": "ANY"}], "rules": {"dns": [{"matchPattern": "*"}]}}]}]
              + parameters.egressFQDNs.map(f, {"toFQDNs": [has(f.matchName) ? {"matchName": f.matchName} : {"matchPattern": f.matchPattern}],
                "toPorts": [{"ports": f.ports.map(p, {"port": string(p), "protocol": "TCP"})}]})}
