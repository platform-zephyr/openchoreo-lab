# Notifications push (serveur ntfy de TEST interne, golden path n°2 : stateless sur OKE).
# Image verifiee [C] : binwiederhier/ntfy:v2.28.0, index multi-arch 6ef4b819... (HEAD registre 2026-11-18 : 200,
# docker-content-digest identique). Source kube-ops d'origine : k8s/applications/catalog/ntfy (PVC, route publique)
# NON reprise : voir NOTES.md. Ce service ne remplace AUCUNE alerte ntfy.sh existante de Paul.
# Stateless STRICT : pas de PVC, pas de base, pas de secret. Cache et auth en MEMOIRE (variables non posees,
# donc aucun chemin inscriptible requis : readOnlyRootFilesystem reste vrai, sans emptyDir).
apiVersion: platform.smadja.dev/v2alpha1
kind: App
metadata:
  name: ntfy
  owner: user:default/paul
  description: Serveur de notifications push (test interne, stateless)
spec:
  source:
    image: docker.io/binwiederhier/ntfy:v2.28.0@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
  cluster: oke
  environments: [production]
  profile: stateless
  runtime:
    port: 8080
    healthPath: /v1/health
    size: small
    runAsUser: 65532
    args: ["serve"]
    env:
      NTFY_LISTEN_HTTP: ":8080"
  exposure: {mode: private, auth: none}
  network: {egress: none}
  backup: {class: none}
  observability: {metrics: {enabled: false}}
